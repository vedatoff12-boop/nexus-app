<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>NexusAI Signals</title>
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#080c18;--bg2:#0d1324;--bg3:#111827;
      --stroke:rgba(255,255,255,0.06);--stroke2:rgba(255,255,255,0.1);
      --text:#eef2ff;--muted:#7c85a3;--muted2:#4b5270;
      --gold:#facc15;--gold2:#eab308;--gold-glow:rgba(250,204,21,0.35);
      --green:#22c55e;--green-glow:rgba(34,197,94,0.3);
      --red:#ef4444;--blue:#3b82f6;
      --r1:24px;--r2:16px;--pill:999px;
      --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow-x:hidden;}
    body{
      font-family:'Outfit',system-ui,-apple-system,sans-serif;
      color:var(--text);
      background:var(--bg);
      -webkit-tap-highlight-color:transparent;
    }
    body.rtl{direction:rtl;}

    /* SCROLLBAR */
    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px;}

    /* MAIN WRAPPER */
    .app-wrap{
      max-width:480px;margin:0 auto;height:100%;overflow-y:auto;
      padding:calc(12px + var(--safeT)) 16px calc(120px + var(--safeB));
      position:relative;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
    }

    /* TOP BAR */
    .top-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 0 12px;
    }
    .top-left{display:flex;align-items:center;gap:8px;}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:livePulse 2s infinite;}
    @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green);}50%{opacity:.5;box-shadow:0 0 3px var(--green);}}
    .live-text{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;}
    .online-count{font-size:11px;color:var(--muted);font-weight:700;}
    .top-right{display:flex;align-items:center;gap:8px;}
    .tg-id{font-size:11px;font-weight:700;color:var(--blue);background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.15);padding:3px 10px;border-radius:var(--pill);}.self-reset-btn{display:none;align-items:center;justify-content:center;height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.12);color:#ff8a8a;font-size:11px;font-weight:800;cursor:pointer;gap:6px}.self-reset-btn:disabled{opacity:.6;cursor:default}

    /* LANG DROPDOWN */
    .lang-drop{position:relative;}
    .lang-btn{background:rgba(255,255,255,0.05);border:1px solid var(--stroke2);border-radius:10px;padding:4px 10px;color:var(--gold);font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;}
    .lang-btn::after{content:'▾';font-size:10px;color:var(--muted);}
    .lang-menu{position:absolute;top:110%;right:0;background:var(--bg3);border:1px solid var(--stroke2);border-radius:12px;padding:4px;z-index:500;display:none;min-width:80px;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
    .lang-menu.open{display:block;}
    .lang-opt{display:block;width:100%;padding:6px 12px;background:none;border:none;color:var(--muted);font-weight:700;font-size:12px;text-align:left;cursor:pointer;border-radius:8px;font-family:inherit;}
    .lang-opt:hover,.lang-opt.active{background:rgba(250,204,21,0.1);color:var(--gold);}

    /* HERO PROFIT */
    .hero{
      text-align:center;padding:20px 0 16px;
      background:radial-gradient(ellipse at 50% 80%,rgba(34,197,94,0.08) 0%,transparent 60%);
    }
    .hero-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}
    .hero-amount{
      font-size:42px;font-weight:900;color:var(--green);
      text-shadow:0 0 30px var(--green-glow),0 0 60px rgba(34,197,94,0.15);
      transition:all 0.3s;position:relative;display:inline-block;
    }
    .hero-amount.bump{animation:profitBump 0.4s ease;}
    @keyframes profitBump{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
    .hero-sub{font-size:12px;color:var(--muted2);margin-top:2px;}
    .hero-float{
      position:absolute;top:-10px;right:-40px;
      font-size:14px;font-weight:800;color:var(--green);
      opacity:0;animation:floatUp 1s ease forwards;pointer-events:none;
    }
    @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}

    /* STREAK / VIP SLIM BAR */
    .meta-bar{
      display:flex;align-items:center;justify-content:center;gap:14px;
      padding:6px 0 4px;
    }
    .meta-pill{
      display:flex;align-items:center;gap:5px;
      padding:4px 10px;border-radius:var(--pill);
      background:rgba(255,255,255,0.04);border:1px solid var(--stroke);
      font-size:11px;font-weight:700;
    }
    .meta-pill .icon{font-size:13px;}
    .meta-pill .val{color:#fff;font-weight:800;}

    /* VIP CARD */
    .vip-card{
      margin:0 16px 12px;padding:12px 16px;border-radius:14px;
      background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(255,215,0,0.02));
      border:1px solid rgba(255,215,0,0.2);position:relative;overflow:hidden;
    }
    .vip-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;
      background:radial-gradient(circle,rgba(255,215,0,0.15),transparent);border-radius:50%;}
    .vip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .vip-badge{display:flex;align-items:center;gap:8px;}
    .vip-badge-icon{font-size:28px;}
    .vip-badge-info{display:flex;flex-direction:column;}
    .vip-badge-tier{font-size:15px;font-weight:800;color:#fff;}
    .vip-badge-acc{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px;}
    .vip-next{text-align:right;}
    .vip-next-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .vip-next-tier{font-size:12px;font-weight:700;color:var(--gold);}
    .vip-progress{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);margin-top:4px;overflow:hidden;}
    .vip-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 0.6s ease;}
    .vip-progress-text{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--muted);font-weight:700;}

    /* GAMES GRID */
    .games-title{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

    .game-card{
      border-radius:var(--r2);padding:16px 14px;cursor:pointer;
      position:relative;overflow:hidden;min-height:110px;
      display:flex;flex-direction:column;justify-content:space-between;
      border:1px solid var(--stroke);
      backdrop-filter:blur(12px);
      transition:transform 0.15s,box-shadow 0.2s;
    }
    .game-card:active{transform:scale(0.97);}
    .game-card:hover{box-shadow:0 8px 30px rgba(0,0,0,0.4);}
    /* Per-game gradients */
    .game-card[data-game="aviator"]{background:linear-gradient(145deg,rgba(239,68,68,0.12),rgba(15,23,42,0.8));border-color:rgba(239,68,68,0.15);}
    .game-card[data-game="jetx"]{background:linear-gradient(145deg,rgba(245,158,11,0.12),rgba(15,23,42,0.8));border-color:rgba(245,158,11,0.15);}
    .game-card[data-game="mines"]{background:linear-gradient(145deg,rgba(59,130,246,0.12),rgba(15,23,42,0.8));border-color:rgba(59,130,246,0.15);}
    .game-card[data-game="penalty"]{background:linear-gradient(145deg,rgba(34,197,94,0.12),rgba(15,23,42,0.8));border-color:rgba(34,197,94,0.15);}
    .game-card[data-game="balloon"]{background:linear-gradient(145deg,rgba(168,85,247,0.12),rgba(15,23,42,0.8));border-color:rgba(168,85,247,0.15);}
    .game-card[data-game="chicken"]{background:linear-gradient(145deg,rgba(251,146,60,0.12),rgba(15,23,42,0.8));border-color:rgba(251,146,60,0.15);}

    .game-top{display:flex;align-items:center;gap:10px;}
    .game-icon{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--stroke2);flex-shrink:0;}
    .game-name{font-size:15px;font-weight:800;color:#fff;line-height:1.1;}
    .game-desc{font-size:10px;color:var(--muted2);font-weight:700;margin-top:2px;}
    .game-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .game-wr{
      display:flex;align-items:center;gap:4px;
      padding:3px 8px;border-radius:8px;
      background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.2);
    }
    .game-wr-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
    .game-wr-text{font-size:12px;font-weight:800;color:var(--green);}
    .game-play{font-size:11px;color:var(--muted2);font-weight:700;display:flex;align-items:center;gap:3px;}
    .game-play::after{content:'▶';font-size:8px;}

    /* LOCKED */
    .locked-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(8,12,24,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);text-align:center;padding:10px;border-radius:var(--r2);}
    .lock-icon{font-size:28px;margin-bottom:6px;}
    .lock-text{color:var(--red);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px;}
    .lock-msg{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.3;}

    /* GAME DETAIL PANEL */
    .panel{margin-top:12px;border-radius:var(--r2);border:1px solid var(--stroke);background:rgba(13,19,36,0.8);padding:16px;backdrop-filter:blur(8px);}
    .backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .back{border:1px solid var(--stroke);background:rgba(255,255,255,0.04);color:var(--muted);padding:8px 14px;border-radius:var(--pill);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
    .p-title{font-size:22px;font-weight:900;color:#fff;}
    .p-sub{margin-top:4px;color:var(--muted);font-size:13px;}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
    .btn{flex:1;min-width:140px;padding:14px;border-radius:14px;border:none;background:rgba(255,255,255,0.06);color:#fff;font-weight:800;cursor:pointer;font-size:14px;font-family:inherit;transition:transform .1s;}
    .btn:active{transform:scale(0.97);}
    .btn.primary{color:#0a0f1e;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 20px var(--gold-glow);}
    .btn[disabled]{opacity:0.4;cursor:not-allowed;background:#1e293b;color:var(--muted);box-shadow:none;}
    .stepbox{margin-top:14px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,0.02);padding:20px;text-align:center;}
    .stepnum{font-size:52px;font-weight:900;color:var(--gold);text-shadow:0 0 20px var(--gold-glow);}
    .steplabel{color:var(--muted2);font-weight:800;letter-spacing:1.5px;font-size:11px;text-transform:uppercase;margin-top:4px;}
    .stepnote{margin-top:10px;color:var(--muted);font-size:12px;}

    /* SIGNAL HISTORY */
    .sig-history{margin-top:14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,0.15);padding:10px 12px;}
    .sig-history-title{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .sig-history-row{display:flex;gap:4px;flex-wrap:wrap;}
    .sig-dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid var(--stroke);}
    .sig-dot.win{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.25);color:var(--green);}
    .sig-dot.lose{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.15);color:var(--red);}

    /* CIRCULAR COUNTDOWN */
    .cd-wrap{margin:12px auto;width:64px;height:64px;position:relative;}
    .cd-wrap svg{transform:rotate(-90deg);}
    .cd-wrap circle{fill:none;stroke-width:4;}
    .cd-wrap .bg{stroke:rgba(255,255,255,0.04);}
    .cd-wrap .prog{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
    .cd-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;font-weight:900;color:var(--gold);}

    /* MINES & PENALTY */
    .mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:280px;margin:16px auto;}
    .mines-cell{aspect-ratio:1;background:rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--stroke);}
    .mines-cell.active{background:var(--gold);box-shadow:0 0 12px var(--gold-glow);border-color:#fff;animation:popIn .3s ease;}
    .penalty-wrapper{width:100%;max-width:300px;height:180px;margin:16px auto;border:3px solid rgba(255,255,255,0.2);border-bottom:none;background:rgba(0,0,0,0.15);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);border-radius:8px 8px 0 0;}
    .penalty-cell{border:1px dashed rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;}
    .penalty-ball{font-size:22px;animation:popIn .3s cubic-bezier(.175,.885,.32,1.275);}
    @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    .tabs{margin-top:14px;}

    /* CONFETTI */
    .confetti-box{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9000;overflow:hidden;}
    .confetti-p{position:absolute;top:-10px;animation:cFall 3s ease-in forwards;}
    @keyframes cFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

    /* MARQUEE */
    .marquee-wrap{position:absolute;left:0;right:0;bottom:0;width:100%;background:var(--bg);border-top:1px solid rgba(250,204,21,0.15);padding:7px 0;z-index:200;overflow:hidden;white-space:nowrap;}
    .marquee-inner{display:inline-block;animation:mqScroll 120s linear infinite;font-size:11px;font-weight:700;color:var(--muted);will-change:transform;}
    .marquee-inner span{color:var(--gold);font-weight:800;}
    @keyframes mqScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    /* SPLASH */
    #splash{display:none !important;}
    .splash-text{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;color:#fff;opacity:0;animation:fadeUp 2.5s ease forwards;}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(20px)}40%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

    /* GEO SELECTOR */
    #geoScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:8000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    #geoScreen.open{display:flex;}
    .geo-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;}
    .geo-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
    .geo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px;}
    .geo-btn{display:flex;align-items:center;gap:10px;padding:16px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid var(--stroke2);cursor:pointer;transition:all .2s;font-family:inherit;}
    .geo-btn:active{transform:scale(0.96);}
    .geo-btn:hover{border-color:var(--gold);background:rgba(250,204,21,0.06);}
    .geo-flag{font-size:28px;}
    .geo-name{font-size:14px;font-weight:700;color:#fff;}

    /* REGISTER BUTTON in lock overlay */
    .reg-btn{margin-top:8px;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0f1e;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
    .promo-text{margin-top:4px;font-size:10px;color:var(--gold);font-weight:700;}

    /* APP SHELL + TAB BAR */
    .app-shell{position:fixed;inset:0;max-width:480px;width:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;height:100vh;height:100dvh;}
    .app-body{flex:1;min-height:0;position:relative;overflow:hidden;padding-bottom:calc(64px + var(--safeB));}
    .tab-bar{position:fixed;left:50%;right:auto;bottom:0;transform:translateX(-50%);max-width:480px;width:100%;height:calc(60px + var(--safeB));padding-bottom:var(--safeB);background:#060a14;border-top:1px solid rgba(250,204,21,0.18);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;z-index:5000;box-shadow:0 -8px 30px rgba(0,0,0,0.65);}
    .tab-item{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;cursor:pointer;color:var(--muted2);transition:all .2s;border:none;background:transparent;font-family:inherit;-webkit-tap-highlight-color:transparent;}
    .tab-item.active{color:var(--gold);background:rgba(250,204,21,0.06);}
    .tab-item .tab-icon{font-size:20px;line-height:1;}
    .tab-item .tab-label{font-size:10px;font-weight:800;text-transform:none;letter-spacing:.1px;white-space:nowrap;}
    .tab-content{display:none;height:100%;}
    .tab-content.active{display:block;}

    /* HELP TOOLTIP */
    .help-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--muted);font-size:9px;font-weight:800;cursor:pointer;margin-left:4px;flex-shrink:0;vertical-align:middle;line-height:1;}
    .help-tooltip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg3);border:1px solid var(--stroke2);border-radius:16px;padding:16px 20px;color:var(--text);font-size:13px;line-height:1.5;max-width:280px;z-index:7000;box-shadow:0 20px 60px rgba(0,0,0,0.7);animation:ttIn .2s ease;}
    .help-tooltip-title{font-weight:800;font-size:14px;margin-bottom:6px;color:var(--gold);}
    .help-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:6999;}
    @keyframes ttIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}

    /* GEO SWITCH BTN */
    .geo-switch{background:rgba(255,255,255,0.05);border:1px solid var(--stroke2);border-radius:10px;padding:4px 10px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;color:var(--muted);font-weight:700;font-size:11px;}
    .geo-switch:active{transform:scale(0.95);}

    /* TOP PLAYERS */
    .top-header{text-align:center;padding:10px 0 16px;}
    .top-header-title{font-size:22px;font-weight:900;color:#fff;}
    .top-header-sub{font-size:11px;color:var(--muted);margin-top:4px;}
    .top-header-date{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:99px;background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.15);color:var(--gold);font-size:11px;font-weight:700;}
    .top-podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0 20px;}
    .podium-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
    .podium-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--stroke);}
    .podium-item:nth-child(2) .podium-avatar{width:58px;height:58px;font-size:22px;border-color:var(--gold);box-shadow:0 0 20px var(--gold-glow);background:rgba(250,204,21,0.1);}
    .podium-item:nth-child(1) .podium-avatar{background:rgba(192,192,192,0.08);border-color:#aaa;}
    .podium-item:nth-child(3) .podium-avatar{background:rgba(205,127,50,0.08);border-color:#cd7f32;}
    .podium-name{font-size:11px;font-weight:700;color:#fff;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

      const tabs=document.getElementById('tabs'),sN=document.getElementById('sN'),nxB=document.getElementById('nxB');
      function dT(){tabs.innerHTML='';const bar=document.createElement('div');bar.className='segmented';bar.style.margin='0';bar.style.maxWidth='100%';CH_D.forEach(d=>{const b=document.createElement('button');b.textContent=T().ch.tb[d];b.className='seg-btn'+(d===chD?' active':'');b.onclick=()=>{chD=d;dT();sN.textContent='-';};bar.appendChild(b);});tabs.appendChild(bar);}
      nxB.onclick=()=>{if(!isFullAccess() && isFreeSignalUsed()){document.querySelector('.stepbox').innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:36px">🎁</div><div style="font-size:15px;font-weight:800;color:#fff;margin-top:8px;line-height:1.45">Esa fue tu señal gratis. Recarga tu cuenta 1xBet y envía la captura al bot para desbloquear señales ILIMITADAS 👇</div></div>`;nxB.disabled=false;nxB.textContent='💰 Recarga en 1xBet';nxB.style.opacity='1';nxB.onclick=openRegLink;return;}if(isFullAccess() && isSignalLimitReached()){const tier=getVipTier();const idx=getVipTierIdx();let uh='';if(idx<VIP_TIERS.length-1){const next=VIP_TIERS[idx+1];const need=next.dep-parseInt(S.get('totalDep')||'0');uh=`<div style="margin-top:14px;padding:10px;background:rgba(255,215,0,0.08);border-radius:10px;border:1px solid rgba(255,215,0,0.2)"><div style="font-size:13px;font-weight:700;color:#fff">${next.icon} ${next.name} - ${next.sigs||'∞'} signals/day, ${next.acc}%</div><div style="font-size:11px;color:var(--gold);margin-top:4px">Add ${need.toLocaleString()} ${geo().currency} in the bot to unlock ⬆</div></div>`;}document.querySelector('.stepbox').innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:36px">⚡</div><div style="font-size:15px;font-weight:800;color:#fff;margin-top:8px">${T().limit||'AI server limit reached'}</div><div style="font-size:12px;color:var(--muted);margin-top:6px">${T().limitSub||'AI servers are under heavy load.'}</div><div style="font-size:13px;color:var(--muted);margin-top:8px">${T().limitDeposit||'Higher deposit = more server resources.'}</div>${uh}</div>`;nxB.disabled=true;nxB.textContent=T().limitBtn||'Server limit';return;}nxB.disabled=true;sN.textContent='...';try{navigator.vibrate&&navigator.vibrate(50);}catch(e){}setTimeout(()=>{if(isFullAccess()) addDailySignal();sN.textContent=`Step ${rndInt(1,6)}`;nxB.disabled=false;playSfx();addProfit(rndInt(3,15));const ts=parseInt(S.get('tsig')||'0')+1;S.set('tsig',ts.toString());addSigHist('chicken');consumeLimitedFreeSignal();if(isFullAccess()&&isSignalLimitReached()){nxB.disabled=true;nxB.textContent=T().limitReached||'Limit reached';}},500);};dT();
    }

    // TOP PLAYERS - weekly seed, multinational, $10k descending
    function sRnd(s){let x=Math.sin(s)*10000;return x-Math.floor(x);}
    function getWeekSeed(){const d=new Date(),y=d.getFullYear(),jan1=new Date(y,0,1),days=Math.floor((d-jan1)/864e5),week=Math.ceil((days+jan1.getDay()+1)/7);return y*100+week;}
    function genTop(){
      const ws=getWeekSeed();
      const baseNames=[...new Set((REAL_NAME_POOL.length?REAL_NAME_POOL:[...geo().names]).map(x=>String(x).trim()).filter(Boolean))];
      while(baseNames.length<100){baseNames.push(`Player${baseNames.length+1}`);}
      const gn=["Aviator","JetX","Mines","Chicken","Balloon","Penalty"];
      const ordered=baseNames.slice(0,100);
      const p=[];
      let prevAmt=10500;
      for(let i=0;i<100;i++){
        const r2=sRnd(ws+i*17+7),r3=sRnd(ws+i*23+11);
        const nm=ordered[i];
        const gm=gn[Math.floor(r2*gn.length)];
        const base=10200*Math.pow(0.952,i);
        const jitter=(r3-0.5)*base*0.15;
        let am=Math.round(base+jitter);
        am=Math.min(am,prevAmt-Math.floor(r3*30+10));
        am=Math.max(am,50);
        prevAmt=am;
        p.push({rk:i+1,nm,gm,am});
      }
      return p;
    }
    function renderTop(){return renderTopPlayers();}
    function renderTopPlayers(){const d=new Date(),ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});document.getElementById('topDate').textContent=`${T().weekOf||'📅 Week of'} ${ds}`;const p=genTop(),pd=document.getElementById('topPodium'),md=['🥇','🥈','🥉'],od=[1,0,2];pd.innerHTML=od.map(i=>`<div class="podium-item"><div class="podium-avatar">${md[i]}</div><div class="podium-name">${p[i].nm}</div><div class="podium-amount">$${p[i].am.toLocaleString()}</div></div>`).join('');document.getElementById('topList').innerHTML=p.map(x=>`<div class="top-row"><div class="top-rank">${x.rk<=3?['🥇','🥈','🥉'][x.rk-1]:'#'+x.rk}</div><div class="top-name">${x.nm}</div><div class="top-game">${x.gm}</div><div class="top-amount">+$${x.am.toLocaleString()}</div></div>`).join('');}

    // HELP TOOLTIPS
    function getHelpData(){return {
      streak:{title:'🔥 Daily Streak',text:{en:'Open the app every day to build your streak. Gold members get better accuracy with longer streaks.',es:'Abre la app cada día para construir tu racha. Los miembros Gold obtienen mejor precisión con rachas más largas.',uz:'Har kuni ilovani oching. Gold a\'zolari uzun seriyada yuqori aniqlik oladi.',az:'Hər gün tətbiqi açın. Gold üzvləri daha uzun seriyada daha yüksək dəqiqlik alır.'}[lang]||'Open the app every day to build your streak.'},
      vip:{title:'🏅 VIP Tier',text:`Your deposit level determines the AI resources allocated to your account.\n\n🥉 Bronze (${geo().sym}1) — 5 signals/day, 90% accuracy\n🥇 Gold (${geo().sym}${geo().gold}) — Unlimited signals, 95% accuracy + personal AI analyst 24/7\n\nGold members get a dedicated AI analyst that guides every session in real-time.\n\nBigger deposit → more resources → better signals → bigger wins 🤝`},
      profit:{title:'💰 Today\'s Profit',text:{en:'Shows total profit from signals followed today. Resets at midnight.',es:'Muestra el beneficio total de las señales seguidas hoy. Se reinicia a medianoche.',uz:'Bugungi signallardan umumiy foyda. Yarim tunda qayta tiklanadi.',az:'Bu gün izlənən siqnallardan ümumi mənfəət. Gecə yarısı sıfırlanır.'}[lang]||'Shows total profit from signals followed today.'},
      winrate:{title:'📊 Win Rate',text:{en:'Historical accuracy of AI predictions for this game, based on thousands of rounds analyzed.',es:'Precisión histórica de las predicciones IA para este juego, basada en miles de rondas analizadas.',uz:'Ushbu o\'yin uchun AI bashoratlarining tarixiy aniqligi, minglab raundlar tahlili asosida.',az:'Bu oyun üçün AI proqnozlarının tarixi dəqiqliyi, minlərlə raund təhlili əsasında.'}[lang]||'Historical accuracy of AI predictions.'}
    };}
    function showHelp(key){
      const d=getHelpData()[key];if(!d)return;
      const ov=document.createElement('div');ov.className='help-overlay';
      const tt=document.createElement('div');tt.className='help-tooltip';
      tt.innerHTML=`<div class="help-tooltip-title">${d.title}</div><div>${d.text}</div>`;
      document.body.appendChild(ov);document.body.appendChild(tt);
      function close(){ov.remove();tt.remove();}
      ov.onclick=close;tt.onclick=close;
    }

    // GEO SWITCH - update button with current flag
    function updGeoSwitch(){
      const btn=document.getElementById('geoSwitchBtn');if(!btn)return;
      if(currentGeo){
        const g=geo();
        document.getElementById('geoSwitchFlag').textContent=g.flag;
        document.getElementById('geoSwitchName').textContent=g.name;
      }
    }

    async function hydrateGeoFromBackend(){
      await refreshAccessState();
      try{
        const backendGeo=String((latpeAccessState&&latpeAccessState.geo)||'').toLowerCase();
        if(GEO_CONFIG[backendGeo]){
          currentGeo=backendGeo;
          S.set('user_geo', currentGeo);
          savedIdKey=`saved_player_id_${currentGeo}`;
          lang=geo().lang||'en';
          S.set('aslang', lang);
          REAL_NAME_POOL=NAME_POOLS[lang]||NAME_POOLS.en;
          const nextUrl=new URL(window.location.href); nextUrl.searchParams.set('geo', currentGeo); history.replaceState({},'',nextUrl);
        }
      }catch(e){}
    }

    // APP INIT after geo is known
    let appStarted=false;
    function initApp(){
      if(appStarted) return;
      appStarted=true;
      try{window.trackBDEvent&&window.trackBDEvent('MiniAppOpen',{geo:String(currentGeo||'uy').toUpperCase(),lang:geo().lang});}catch(e){}
      lang=geo().lang||'en';S.set('aslang',lang);
      applyStatic();buildMarquee();updProfit();updOnline();updGeoSwitch();
      // Start on signals tab
      switchTab('signals');
    }

    // CACHE-BUST: passive marker only. Never force reload before boot in Telegram WebView.
    const APP_VERSION='20260615-freesignal';
    (function cacheBust(){
      try{
        const lk='nexus_latpe_ver';
        const currentUrl=new URL(window.location.href);
        const urlVersion=currentUrl.searchParams.get('v');
        if(urlVersion!==APP_VERSION){
          currentUrl.searchParams.set('v',APP_VERSION);
          history.replaceState({},'',currentUrl.toString());
        }
        S.set(lk,APP_VERSION);
      }catch(e){console.warn('[cacheBust]',e);}
    })();

    function bootFailsafeRender(){
      try{lang=geo().lang||'es';S.set('aslang',lang);}catch(e){}
      try{applyGeoChrome();}catch(e){}
      try{renderHome();}catch(e){}
      try{switchTab('signals');}catch(e){}
      try{updateChatHeader();}catch(e){}
    }
    // INIT — robust boot, never blocks on async work
    let _bootStarted=false;
    function bootApp(){
      if(_bootStarted) return;
      _bootStarted=true;
      // Init synchronously — UI is visible immediately after this returns
      try{initApp();}catch(e){console.warn('[bootApp] initApp failed',e);bootFailsafeRender();}
      // Always force viewport fix again after init
      try{fixVH();}catch(e){}
      // Background hydration — never blocks UI, errors swallowed
      Promise.resolve().then(()=>{
        return hydrateGeoFromBackend();
      }).then(()=>{
        try{applyGeoChrome();}catch(e){}
        try{applyStatic();}catch(e){}
        try{updGeoSwitch();}catch(e){}
        // hydrateGeoFromBackend already performs the single access refresh.
      }).catch(e=>{console.warn('[bootApp] hydrate failed',e);});
    }
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded', bootApp, {once:true});
    }else{
      bootApp();
    }
    // Failsafe: if something blocks DOMContentLoaded, run anyway after 1.2s
    setTimeout(bootApp, 1200);
    setTimeout(()=>{try{if(!appStarted)bootFailsafeRender();}catch(e){}}, 1800);
  </script>
