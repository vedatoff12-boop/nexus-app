<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>NexusAI Sinyaller</title>
  <style>
    :root{--bg:#0b1020;--panel:#121933;--panel2:#171f3f;--text:#fff;--muted:#9ca3af;--gold:#facc15;--gold2:#f59e0b;--green:#22c55e;--red:#ef4444;--stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.12)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;background:radial-gradient(circle at top,#16214a 0,#0b1020 45%,#070b16 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif}
    .app-shell{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column}.app-body{padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding-top:8px}.top-left{display:flex;align-items:center;gap:8px}.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}.live-text,.online-count{font-size:12px;color:var(--muted);font-weight:700}
    .hero{padding:18px;border-radius:24px;border:1px solid var(--stroke);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));box-shadow:0 16px 40px rgba(0,0,0,.26)}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.26);color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.4px}.hero-title{margin:12px 0 6px;font-size:28px;font-weight:900;line-height:1.05}.hero-sub{font-size:13px;line-height:1.5;color:var(--muted)}
    .games-title{font-size:18px;font-weight:900;padding:2px 2px 0}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg-btn{border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--stroke)}.seg-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game-card{padding:14px;border-radius:20px;border:1px solid var(--stroke);background:linear-gradient(180deg,var(--panel),var(--panel2));cursor:pointer;transition:.15s transform,.15s border-color;position:relative}.game-card:active{transform:scale(.98)}.game-card:hover{border-color:rgba(250,204,21,.26)}
    .game-top{display:flex;align-items:flex-start;gap:12px}.game-icon{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:24px}.game-name{font-size:16px;font-weight:900}.game-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}.game-bottom{margin-top:14px;display:flex;justify-content:flex-end}.game-play{font-size:12px;font-weight:900;color:var(--gold)}
    .panel{padding:14px;border-radius:22px;border:1px solid var(--stroke);background:linear-gradient(180deg,var(--panel),var(--panel2))}.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{border:none;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#fff;font-weight:800;cursor:pointer}.slot-mini-pill{margin-left:auto;padding:8px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.22);color:var(--gold);font-size:12px;font-weight:800}
    .p-title{font-size:22px;font-weight:900;margin:4px 0}.p-sub{font-size:13px;color:var(--muted);line-height:1.5}.stepbox{margin-top:14px;padding:18px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);text-align:center}.stepnum{font-size:42px;font-weight:900;line-height:1.05}.steplabel{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1px;margin-top:8px}.stepnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.btnrow{display:flex;gap:10px;margin-top:14px}.btn{flex:1;border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}.btn:disabled{opacity:.45;cursor:not-allowed}
    .cd-wrap{display:flex;align-items:center;justify-content:center;position:relative;margin-top:14px}.cd-num{position:absolute;font-size:18px;font-weight:900;color:#fff}.cd-wrap svg{transform:rotate(-90deg)} .cd-wrap .bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6}.cd-wrap .prog{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round}
    .sig-history{margin-top:14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,.15);padding:10px 12px}.sig-history-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.sig-history-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.sig-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.sig-dot.win{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}.sig-dot.lose{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
    .mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mines-cell,.penalty-cell{height:48px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-weight:900}.mines-cell.active{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.28)}.penalty-wrapper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.penalty-ball{font-size:24px}
    .slot-badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.22);font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.5px}.slot-analyzing{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 4px}.slot-wave{display:flex;gap:6px;align-items:flex-end;height:30px}.slot-wave span{width:7px;border-radius:999px;background:linear-gradient(180deg,var(--gold),var(--gold2));animation:w 1s ease-in-out infinite}.slot-wave span:nth-child(2){animation-delay:.1s}.slot-wave span:nth-child(3){animation-delay:.2s}.slot-wave span:nth-child(4){animation-delay:.3s}.slot-wave span:nth-child(5){animation-delay:.4s}@keyframes w{0%,100%{height:8px;opacity:.5}50%{height:28px;opacity:1}}
    .slot-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.slot-hero-icon{font-size:42px}.slot-status-line{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font-size:13px}.slot-status-line span{color:var(--muted)}.slot-status-line strong{color:#fff;text-align:right}
    .marquee-wrap{overflow:hidden;border-radius:16px;padding:10px 0;border:1px solid var(--stroke);background:rgba(255,255,255,.04)}.marquee-inner{display:inline-block;white-space:nowrap;animation:marq 40s linear infinite;font-size:13px;color:var(--muted)}.marquee-inner span{color:var(--gold);font-weight:800}@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-body">
      <div class="top-bar"><div class="top-left"><div class="live-dot"></div><span class="live-text">Canlı</span><span class="online-count" id="onlineCount">• 247</span></div></div>
      <div class="hero">
        <div class="hero-badge">⚡ AKTİF SİNYALLER</div>
        <div class="hero-title">Crash + Slot</div>
        <div class="hero-sub">Sadece sinyal katmanı. Ekstra sekme yok, erişim kontrolü yok, sohbet yok.</div>
      </div>
      <div class="games-title">Bir oyun seç:</div>
      <div class="segmented signal-switcher"><button class="seg-btn active" id="modeCrash">Crash</button><button class="seg-btn" id="modeSlot">Slot</button></div>
      <div id="app"></div>
      <div class="marquee-wrap"><div class="marquee-inner" id="marqueeText"></div></div>
    </div>
  </div>
  <script>
    const S={get(k){try{return localStorage.getItem('nexustrsignals:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('nexustrsignals:'+k,v)}catch(e){}}};
    const ICONS={aviator:'✈️',jetx:'🚀',chicken:'🐔',penalty:'⚽',mines:'💣',balloon:'🎈'};
    const SLOT_GAMES=['sweet','gates','sugar'];
    const SLOT_ICONS={sweet:'🍭',gates:'⚡',sugar:'🍬'};
    const REAL_NAME_POOL=['Ahmet','Mehmet','Kerem','Mert','Emir','Yiğit','Berk','Onur','Kaan','Batuhan','Can','Serkan','Tolga','Eren','Furkan','Deniz','Zeynep','Elif','Ceren','Melis','Sena','Ece','Naz','Mira','Ayşe','Hakan','Umut','Arda','Baran','Samet'];
    const STR={tr:{cg:'Bir oyun seç:',back:'Menü',wait:'Bekle',tabs:{crash:'Crash',slot:'Slot'},g:{aviator:{n:'Aviator',d:'Crash oyunu'},jetx:{n:'JetX',d:'SmartSoft Crash'},chicken:{n:'Chicken Road',d:'Risk seviyeleri'},penalty:{n:'Penalty',d:'Kaleye vur'},mines:{n:'Mines',d:'Bombalardan kaç'},balloon:{n:'Balloon',d:'Şişir ve çek'},sweet:{n:'Sweet Bonanza',d:'Tatlı slot sinyalleri'},gates:{n:'Gate of Olympus',d:'Zeus slot sinyalleri'},sugar:{n:'Sugar Rush',d:'Şeker slot sinyalleri'}},ch:{t:'Chicken Road',s:'Zorluk seçin.',nx:'SONRAKİ ADIM',w:s=>`Bekle ${s} sn`,tb:{easy:'Kolay',medium:'Orta',hard:'Zor',hardcore:'Hardcore'}},av:{t:'Aviator',s:'Her dakika yenilenir.',b:'SİNYAL AL',l:'KATSAYI',u:t=>`<strong>${t}</strong> saatinde güncellenir`},jx:{t:'JetX',s:'Maksimum 10x.',b:'SİNYAL AL',l:'KATSAYI',u:t=>`<strong>${t}</strong> saatinde güncellenir`},pe:{t:'Penalty',s:'Hedef bölgeyi seç.',b:'SİNYAL AL',l:'HEDEF',u:t=>`<strong>${t}</strong> saatinde güncellenir`},mi:{t:'Mines',s:'Güvenli kutular işaretli.',b:'SİNYAL AL',l:'GÜVENLİ KUTULAR',u:t=>`<strong>${t}</strong> saatinde güncellenir`},ba:{t:'Balloon',s:'Patlamadan önce çek.',b:'SİNYAL AL',l:'ÇEKİM',u:t=>`<strong>${t}</strong> saatinde güncellenir`},slot:{sub:'Oyunu seç, sinyali al ve kısa analizi bekle.',badge:'AKTİF SLOT STRATEJİSİ',title:'Yeni strateji hazırlanıyor',loadingTitle:'Oyun analiz ediliyor...',loadingSub:'Volatilite, pattern ve giriş zamanı taranıyor',cta:'STRATEJİ AL',risk:'Risk',steps:'Adımlar',finishLabel:'Not',activeTitle:'PLAN HAZIR',activeSub:n=>`${n} adımlı slot planı hazır`,stepLabel:n=>`Adım ${n}`}}};
    function T(){return STR.tr}
    let signalMode='crash',timer=null,onlineVal=247;
    function rndInt(a,b){return Math.floor(Math.random()*(b-a+1))+a} function hhmm(d){return d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
    function getCd(k){const t=parseInt(S.get('cd_'+k)||'0'); return Math.max(0,Math.ceil((t-Date.now())/1000))} function setCd(k,s=30){S.set('cd_'+k,String(Date.now()+s*1000))}
    function getSigHist(k){try{return JSON.parse(S.get('hist_'+k)||'[]')}catch(e){return []}} function addSigHist(k){const arr=getSigHist(k); arr.unshift(Math.random()>0.22); S.set('hist_'+k,JSON.stringify(arr.slice(0,8)))}
    function buildMarquee(){const nowBucket=Math.floor(Date.now()/15000); let h=''; REAL_NAME_POOL.slice(0,16).forEach((name,i)=>{const amt=rndInt(2000,12000); const verb=['kazandı','çekti','aldı','vurdu'][(nowBucket+i)%4]; h+=`${name} ${verb} <span>₺${amt.toLocaleString('tr-TR')}</span>`+(i<15?'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;':'')}); document.getElementById('marqueeText').innerHTML=h+'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'+h}
    function updOnline(){onlineVal+=Math.random()>.5?rndInt(1,5):-rndInt(1,5); if(onlineVal<180)onlineVal=190; if(onlineVal>420)onlineVal=390; document.getElementById('onlineCount').textContent='• '+onlineVal}
    function renderSigHist(k){const h=getSigHist(k); if(!h.length) return ''; return `<div class="sig-history"><div class="sig-history-title">Son sinyaller</div><div class="sig-history-row">${h.map(w=>`<div class="sig-dot ${w?'win':'lose'}">${w?'✓':'•'}</div>`).join('')}</div></div>`}
    function genVal(k){if(k==='aviator')return (Math.random()*4.5+1.2).toFixed(2)+'x'; if(k==='jetx')return (Math.random()*4+1.3).toFixed(2)+'x'; if(k==='balloon')return (Math.random()*5+1.4).toFixed(2)+'x'; if(k==='mines'){const nums=[]; while(nums.length<3){const n=rndInt(0,24); if(!nums.includes(n)) nums.push(n)} return nums.sort((a,b)=>a-b)} if(k==='penalty')return rndInt(0,14); return ['2.1x köprü','1.9x güvenli çıkış','2.4x kısa koşu'][rndInt(0,2)]}
    const SLOT_STRATEGY_PRESETS={sweet:[{risk:'Orta',steps:['20 spin taban bahis ile başla','Bonus sinyali görünürse 10 spin x1.5 artır','İlk temiz tumble sonrası çık'],tip:'Aynı döngüde ikinci bonusu kovalamayın.'},{risk:'Düşük',steps:['15 düz spin ile başla','Ekran soğursa 20 saniye bekle','Aynı bahisle 12 spin tekrar gir'],tip:'Sakin seriler için ideal.'}],gates:[{risk:'Yüksek',steps:['10 ısınma spin ile aç','İlk multiplier sinyalinden sonra 8 spin x2 yap','İlk güçlü vuruştan sonra çık'],tip:'İki ölü turdan sonra chase yapmayın.'},{risk:'Orta',steps:['Sadece 12 taban spin','Aksiyon yoksa bekle ve bir kez daha dene','İkinci döngüyü geçme'],tip:'Kısa ve kontrollü seans.'}],sugar:[{risk:'Düşük',steps:['18 spin minimum bahis ile başla','Cluster birikimini izle','İlk temiz sekans sonrası kâr al'],tip:'Bir iyi vuruştan sonra sıfırla.'},{risk:'Orta',steps:['10 ısınma spin','Grid bağlanmaya başlarsa 6 spin x1.4 yükselt','İlk premium combo sonrası çık'],tip:'Ölü mini-rundan sonra uzatma.'}]};
    function pickSlotSignal(k){const pool=SLOT_STRATEGY_PRESETS[k]||SLOT_STRATEGY_PRESETS.sugar; const item=pool[rndInt(0,pool.length-1)]; return {...item,stepCount:item.steps.length}}
    function renderHome(){if(timer)clearInterval(timer); const app=document.getElementById('app'); app.innerHTML=''; const h=document.createElement('div'); h.className='games-grid'; const games=signalMode==='slot'?SLOT_GAMES:['aviator','jetx','mines','penalty','balloon','chicken']; games.forEach(k=>{const g=T().g[k]; const c=document.createElement('div'); c.className='game-card'; c.onclick=()=>signalMode==='slot'?renderSlotGame(k):(k==='chicken'?renderChicken():renderGame(k)); const icon=signalMode==='slot'?(SLOT_ICONS[k]||'🎰'):(ICONS[k]||'🎮'); c.innerHTML=`<div class="game-top"><div class="game-icon">${icon}</div><div><div class="game-name">${g.n}</div><div class="game-desc">${g.d}</div></div></div><div class="game-bottom"><div class="game-play">${signalMode==='slot'?'Strateji Al':'Sinyal Al'}</div></div>`; h.appendChild(c)}); app.appendChild(h); document.getElementById('modeCrash').classList.toggle('active',signalMode==='crash'); document.getElementById('modeSlot').classList.toggle('active',signalMode==='slot')}
    function renderGame(k){if(timer)clearInterval(timer); const app=document.getElementById('app'); app.innerHTML=''; const gk={aviator:'av',jetx:'jx',mines:'mi',penalty:'pe',balloon:'ba'}[k]||'av'; const td=T()[gk]||T().av; let ch=`<div class="stepnum" id="cD">...</div><div class="steplabel">${td.l}</div>`; if(k==='mines'){let g='<div class="mines-grid">'; for(let i=0;i<25;i++)g+='<div class="mines-cell"></div>'; g+='</div>'; ch=g+`<div class="steplabel">${td.l}</div>`;} else if(k==='penalty'){let g='<div class="penalty-wrapper">'; for(let i=0;i<15;i++)g+='<div class="penalty-cell"></div>'; g+='</div>'; ch=g+`<div class="steplabel">${td.l}</div>`;} app.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← ${T().back}</button><div class="slot-mini-pill">Canlı sinyal</div></div><h3 class="p-title">${td.t}</h3><div class="p-sub">${td.s}</div><div class="stepbox" id="gBox">${ch}<div class="stepnote">${td.u(hhmm(new Date()))}</div></div><div class="cd-wrap" id="cdW" style="display:none"><svg width="64" height="64"><circle class="bg" cx="32" cy="32" r="28"/><circle class="prog" id="cdP" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="0"/></svg><div class="cd-num" id="cdN">30</div></div><div class="btnrow"><button class="btn primary" id="sBtn">${td.b}</button></div>${renderSigHist(k)}</div>`; const btn=document.getElementById('sBtn'),box=document.getElementById('gBox'),cdW=document.getElementById('cdW'),cdP=document.getElementById('cdP'),cdN=document.getElementById('cdN'); const circ=175.93;
      function uBtn(){const l=getCd(k); if(l>0){btn.disabled=true; btn.textContent=`${T().wait} ${l} sn`; cdW.style.display=''; cdP.style.strokeDashoffset=circ*(1-l/30); cdN.textContent=l;} else {btn.disabled=false; btn.textContent=td.b; cdW.style.display='none';}}
      function showSig(){const v=genVal(k); addSigHist(k); if(k==='aviator'||k==='jetx'||k==='balloon'){box.innerHTML=`<div class="stepnum">${v}</div><div class="steplabel">${td.l}</div><div class="stepnote">${td.u(hhmm(new Date()))}</div>`;} else if(k==='mines'){let g='<div class="mines-grid">'; for(let i=0;i<25;i++){const s=v.includes(i); g+=`<div class="mines-cell${s?' active':''}">${s?'⭐️':''}</div>`;} g+='</div>'; box.innerHTML=g+`<div class="steplabel">${td.l}</div><div class="stepnote">${td.u(hhmm(new Date()))}</div>`;} else if(k==='penalty'){let g='<div class="penalty-wrapper">'; for(let i=0;i<15;i++){const hit=i===v; g+=`<div class="penalty-cell"><div class="${hit?'penalty-ball':''}">${hit?'⚽':''}</div></div>`;} g+='</div>'; box.innerHTML=g+`<div class="steplabel">${td.l}</div><div class="stepnote">${td.u(hhmm(new Date()))}</div>`;} const old=document.querySelector('.sig-history'); if(old){const tmp=document.createElement('div'); tmp.innerHTML=renderSigHist(k); if(tmp.firstChild) old.parentNode.replaceChild(tmp.firstChild,old);}}
      uBtn(); timer=setInterval(uBtn,1000); btn.onclick=()=>{if(getCd(k)>0)return; setCd(k); showSig(); uBtn();}; }
    function renderChicken(){if(timer)clearInterval(timer); const td=T().ch; const app=document.getElementById('app'); app.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← ${T().back}</button><div class="slot-mini-pill">Canlı sinyal</div></div><h3 class="p-title">${td.t}</h3><div class="p-sub">${td.s}</div><div class="games-grid" style="margin-top:14px"><button class="btn primary" onclick="runChicken('easy')">${td.tb.easy}</button><button class="btn primary" onclick="runChicken('medium')">${td.tb.medium}</button><button class="btn primary" onclick="runChicken('hard')">${td.tb.hard}</button><button class="btn primary" onclick="runChicken('hardcore')">${td.tb.hardcore}</button></div><div class="stepbox" id="chickenBox" style="margin-top:14px"><div class="stepnum">🐔</div><div class="steplabel">Chicken Road</div><div class="stepnote">Zorluk seç ve yeni sinyali bekle</div></div></div>`}
    function runChicken(level){const box=document.getElementById('chickenBox'); const labels={easy:'Kolay',medium:'Orta',hard:'Zor',hardcore:'Hardcore'}; box.innerHTML=`<div class="slot-analyzing"><div style="font-size:44px">🐔</div><div class="slot-wave"><span></span><span></span><span></span><span></span><span></span></div><div style="font-size:14px;font-weight:900">Oyun analiz ediliyor...</div><div class="stepnote">${labels[level]} seviye için sinyal hazırlanıyor</div></div>`; setTimeout(()=>{addSigHist('chicken_'+level); const cash={easy:'1.7x',medium:'2.2x',hard:'3.1x',hardcore:'4.3x'}[level]; box.innerHTML=`<div class="stepnum">${cash}</div><div class="steplabel">KASA ÇIKIŞI</div><div class="stepnote">${labels[level]} · ${hhmm(new Date())} saatinde güncellendi</div>${renderSigHist('chicken_'+level)}`;},10000)}
    function renderSlotGame(k){if(timer)clearInterval(timer); const app=document.getElementById('app'); app.innerHTML=''; const copy=T().slot; const g=T().g[k]; app.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← ${T().back}</button><div class="slot-mini-pill">Slot stratejisi</div></div><h3 class="p-title">${g.n}</h3><div class="p-sub">${copy.sub}</div><div class="stepbox" id="slotBox"><div class="slot-analyzing"><div style="font-size:42px">${SLOT_ICONS[k]||'🎰'}</div><div class="slot-badge">${copy.badge}</div><div style="font-size:15px;font-weight:800">${copy.title}</div><div class="stepnote">${copy.loadingSub}</div></div></div><div class="btnrow"><button class="btn primary" id="slotBtn">${copy.cta}</button></div>${renderSigHist('slot_'+k)}</div>`; const btn=document.getElementById('slotBtn'),box=document.getElementById('slotBox'); function update(){const left=getCd('slot_'+k); if(left>0){btn.disabled=true; btn.textContent='Bekle '+left+' sn';} else {btn.disabled=false; btn.textContent=copy.cta;}} function renderCard(sig){const stepsHtml=sig.steps.map((step,idx)=>`<div class="slot-status-line"><span>${copy.stepLabel(idx+1)}</span><strong>${step}</strong></div>`).join(''); box.innerHTML=`<div class="slot-hero"><div class="slot-badge">${copy.badge}</div><div class="slot-hero-icon">${SLOT_ICONS[k]||'🎰'}</div><div style="font-size:24px;font-weight:900">${copy.activeTitle}</div><div class="stepnote">${copy.activeSub(sig.stepCount)}</div></div><div style="display:grid;gap:8px;margin-top:12px"><div class="slot-status-line"><span>${copy.risk}</span><strong>${sig.risk}</strong></div><div class="slot-status-line"><span>${copy.steps}</span><strong>${sig.stepCount}</strong></div></div><div style="display:grid;gap:8px;margin-top:10px">${stepsHtml}</div><div style="margin-top:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;line-height:1.5"><span style="color:var(--muted)">${copy.finishLabel}:</span> ${sig.tip}</div>`; const old=document.querySelector('.sig-history'); if(old){const tmp=document.createElement('div'); tmp.innerHTML=renderSigHist('slot_'+k); if(tmp.firstChild) old.parentNode.replaceChild(tmp.firstChild,old);}} update(); timer=setInterval(update,1000); btn.onclick=()=>{if(getCd('slot_'+k)>0)return; btn.disabled=true; box.innerHTML=`<div class="slot-analyzing"><div style="font-size:42px">${SLOT_ICONS[k]||'🎰'}</div><div class="slot-wave"><span></span><span></span><span></span><span></span><span></span></div><div style="font-size:15px;font-weight:800">${copy.loadingTitle}</div><div class="stepnote">${copy.loadingSub}</div></div>`; setTimeout(()=>{addSigHist('slot_'+k); setCd('slot_'+k,10); renderCard(pickSlotSignal(k)); update();},10000)}}
    document.getElementById('modeCrash').onclick=()=>{signalMode='crash'; renderHome()}; document.getElementById('modeSlot').onclick=()=>{signalMode='slot'; renderHome()};
    buildMarquee(); updOnline(); setInterval(updOnline,4000); renderHome();
  </script>
</body>
