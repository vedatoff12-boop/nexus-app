<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>NexusAI Sinyaller</title>
  <style>
    :root{--bg:#0b1020;--panel:#121933;--panel2:#171f3f;--text:#fff;--muted:#9ca3af;--gold:#facc15;--gold2:#f59e0b;--green:#22c55e;--red:#ef4444;--stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.12)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;background:radial-gradient(circle at top,#16214a 0,#0b1020 45%,#070b16 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif}
    .confetti-box{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:50}.confetti-p{position:absolute;top:-20px;animation:fall linear forwards}.app-shell{max-width:430px;min-height:100vh;margin:0 auto}.app-body{padding:14px 14px 28px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px}.top-left,.top-right{display:flex;align-items:center;gap:8px}.live-dot,.live-text,.online-count,.lang-btn,.marquee-wrap{display:none!important}.brand-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:.2px}.brand-sub{font-size:11px;color:var(--muted);font-weight:700}
    .games-title{font-size:18px;font-weight:900;padding:14px 2px 10px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg-btn{border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--stroke)}.seg-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.game-card{padding:14px;border-radius:20px;border:1px solid var(--stroke);background:linear-gradient(180deg,var(--panel),var(--panel2));cursor:pointer;transition:.15s transform,.15s border-color;position:relative}.game-card:active{transform:scale(.98)}.game-card:hover{border-color:rgba(250,204,21,.26)}.game-top{display:flex;align-items:flex-start;gap:12px}.game-icon{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:24px}.game-name{font-size:16px;font-weight:900}.game-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}.game-bottom{margin-top:14px;display:flex;justify-content:flex-end}.game-play{font-size:12px;font-weight:900;color:var(--gold)}
    .panel{margin-top:12px;padding:14px;border-radius:22px;border:1px solid var(--stroke);background:linear-gradient(180deg,var(--panel),var(--panel2))}.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{border:none;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#fff;font-weight:800;cursor:pointer}.slot-mini-pill{margin-left:auto;padding:8px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.22);color:var(--gold);font-size:12px;font-weight:800}
    .p-title{font-size:22px;font-weight:900;margin:4px 0}.p-sub{font-size:13px;color:var(--muted);line-height:1.5}.stepbox{margin-top:14px;padding:18px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);text-align:center}.stepnum{font-size:42px;font-weight:900;line-height:1.05}.steplabel{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1px;margin-top:8px}.stepnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.btnrow{display:flex;gap:10px;margin-top:14px}.btn{flex:1;border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}.btn:disabled{opacity:.45;cursor:not-allowed}
    .cd-wrap{display:flex;align-items:center;justify-content:center;position:relative;margin-top:14px}.cd-num{position:absolute;font-size:18px;font-weight:900;color:#fff}.cd-wrap svg{transform:rotate(-90deg)} .cd-wrap .bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6}.cd-wrap .prog{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round}
    .sig-history{margin-top:14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,.15);padding:10px 12px}.sig-history-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.sig-history-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.sig-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.sig-dot.win{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}.sig-dot.lose{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
    .mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mines-cell,.penalty-cell{height:48px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-weight:900}.mines-cell.active{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.28)}.penalty-wrapper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.penalty-ball{font-size:24px}
    .tabs{margin-top:14px}.slot-badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.22);font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.5px}.slot-analyzing{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 4px}.slot-wave{display:flex;gap:6px;align-items:flex-end;height:30px}.slot-wave span{width:7px;border-radius:999px;background:linear-gradient(180deg,var(--gold),var(--gold2));animation:w 1s ease-in-out infinite}.slot-wave span:nth-child(2){animation-delay:.1s}.slot-wave span:nth-child(3){animation-delay:.2s}.slot-wave span:nth-child(4){animation-delay:.3s}.slot-wave span:nth-child(5){animation-delay:.4s}@keyframes w{0%,100%{height:8px;opacity:.5}50%{height:28px;opacity:1}}.slot-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.slot-hero-icon{font-size:42px}.slot-status-line{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font-size:13px}.slot-status-line span{color:var(--muted)}.slot-status-line strong{color:#fff;text-align:right}
    .marquee-wrap{margin-top:14px;overflow:hidden;border-radius:16px;padding:10px 0;border:1px solid var(--stroke);background:rgba(255,255,255,.04)}.marquee-inner{display:inline-block;white-space:nowrap;animation:marq 40s linear infinite;font-size:13px;color:var(--muted)}.marquee-inner span{color:var(--gold);font-weight:800}@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  </style>
</head>
<body>
  <div class="confetti-box" id="confettiBox"></div>
  <div class="app-shell"><div class="app-body">
    <div class="top-bar"><div class="top-left"><div><div class="brand-title">Nexus AI</div><div class="brand-sub">Canlı sinyaller</div></div></div><div class="top-right"><span class="online-count" id="onlineCount">• 247</span></div></div>
    <div id="app"></div>
    <div class="marquee-wrap"><div class="marquee-inner" id="marqueeText"></div></div>
  </div></div>
<script>
const S={get(k){try{return localStorage.getItem('nexustrsignals:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('nexustrsignals:'+k,v)}catch(e){}}};
const ICONS={aviator:'✈️',jetx:'🚀',chicken:'🐔',penalty:'⚽',mines:'💣',balloon:'🎈'}; const WIN_RATES={aviator:92,jetx:89,mines:87,penalty:91,balloon:88,chicken:85};
const REAL_NAME_POOL=['amirul','Cikgu','Danial H.','Izzat','fadhil','Aiman','Zul','nizam 🚀','atikah','syahir','fiza','Iwan','alif','asyraf','zack','naufal','fikri','farhan','adam','siti','rayyan 💸','izwan','taufiq','arif','najwa','yusof','aqil','kevin','zarith','m. haikal'];
const STR={tr:{cg:'Bir oyun seç:',back:'Menü',wait:'Bekle',tabs:{crash:'Crash',slot:'Slot'},slot:{title:'Slot Sinyalleri',sub:'Oyunu seç, sinyali al ve 30 saniyelik analizi bekle.',cta:'SİNYAL AL',loadingTitle:'Oyun analiz ediliyor...',loadingSub:'Yeni sinyal hazırlanıyor',readyIn:s=>`Yaklaşık ${s} sn içinde hazır`},g:{aviator:{n:'Aviator',d:'Crash oyunu'},jetx:{n:'JetX',d:'SmartSoft Crash'},chicken:{n:'Chicken Road',d:'Risk seviyeleri'},penalty:{n:'Penalty',d:'Kaleye vur'},mines:{n:'Mines',d:'Bombalardan kaç'},balloon:{n:'Balloon',d:'Şişir ve çek'},sweet:{n:'Sweet Bonanza',d:'Tatlı slot sinyalleri'},gates:{n:'Gate of Olympus',d:'Zeus slot sinyalleri'},sugar:{n:'Sugar Rush',d:'Şeker slot sinyalleri'}},ch:{t:'Chicken Road',s:'Zorluk seçin.',nx:'SONRAKİ ADIM',tb:{easy:'Kolay',medium:'Orta',hard:'Zor',hardcore:'Hardcore'}},av:{t:'Aviator',s:'Her dakika yenilenir.',b:'SİNYAL AL',l:'KATSAYI',u:t=>`<strong>${t}</strong> saatinde güncellenir`},jx:{t:'JetX',s:'Maksimum 10x.',b:'SİNYAL AL',l:'KATSAYI',u:t=>`<strong>${t}</strong> saatinde güncellenir`},pe:{t:'Penalty',s:'Hedef bölgeyi seç.',b:'SİNYAL AL',l:'HEDEF',u:t=>`<strong>${t}</strong> saatinde güncellenir`},mi:{t:'Mines',s:'Güvenli kutular işaretli.',b:'SİNYAL AL',l:'GÜVENLİ KUTULAR',u:t=>`<strong>${t}</strong> saatinde güncellenir`},ba:{t:'Balloon',s:'Patlamadan önce çek.',b:'SİNYAL AL',l:'ÇEKİM',u:t=>`<strong>${t}</strong> saatinde güncellenir`}}};
function T(){return STR.tr} function hhmm(d){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;} function rndInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function getCd(k){return Math.max(0,Math.ceil((parseInt(S.get(`cd_${k}`)||'0')-Date.now())/1000));} function setCd(k){S.set(`cd_${k}`,Date.now()+10000);} 
function genVal(k){if(k==='jetx'){let v=Math.random()<.85?1.1+Math.random()*1.9:3+Math.random()*7;return Math.min(v,10).toFixed(2)+'x';} if(k==='aviator'){let v=Math.random()<.88?1.1+Math.random()*6:8+Math.random()*20;return v.toFixed(2)+'x';} if(k==='balloon'){let v=Math.random()<.88?1.1+Math.random()*2:3+Math.random()*10;return v.toFixed(2)+'x';} if(k==='mines'){let s=[];while(s.length<4){const r=Math.floor(Math.random()*25);if(!s.includes(r))s.push(r);}return s;} if(k==='penalty') return Math.floor(Math.random()*15); return '2.00x';}
function getSigHist(k){try{return JSON.parse(S.get(`sh_${k}`)||'[]')}catch(e){return[];}} function addSigHist(k){let h=getSigHist(k);h.push(Math.random()<(WIN_RATES[k]||88)/100?1:0);if(h.length>10)h=h.slice(-10);S.set(`sh_${k}`,JSON.stringify(h));return h;} function renderSigHist(k){const h=getSigHist(k);if(!h.length)return '';return `<div class="sig-history"><div class="sig-history-title">Recent Sinyaller</div><div class="sig-history-row">${h.map(w=>`<div class="sig-dot ${w?'win':'lose'}">${w?'✓':'✗'}</div>`).join('')}</div></div>`;}
let signalMode='crash',timer=null; const SLOT_GAMES=['sweet','gates','sugar']; const SLOT_ICONS={sweet:'🍭',gates:'⚡',sugar:'🍬'}; const SLOT_STRATEGY_PRESETS={sweet:[{risk:'Orta',steps:['4 TL — 20 çevir','6 TL — 15 çevir','8 TL — 12 çevir','4 TL — 16 çevir'],tip:'Tur bitince oyundan çık, tekrar giriş yap ve yeni strateji al.'},{risk:'Düşük',steps:['4 TL — 18 çevir','6 TL — 14 çevir','4 TL — 18 çevir'],tip:'Seri tamamlanınca oyunu yenileyip bir sonraki plana geç.'},{risk:'Yüksek',steps:['6 TL — 15 çevir','8 TL — 12 çevir','10 TL — 10 çevir','8 TL — 12 çevir','6 TL — 14 çevir'],tip:'Tüm adımlar bitince oyundan çık ve yeni strateji bekle.'}],gates:[{risk:'Orta',steps:['6 TL — 14 çevir','8 TL — 12 çevir','10 TL — 10 çevir','6 TL — 14 çevir'],tip:'Tur bitince oyundan çık, tekrar giriş yap ve yeni strateji al.'},{risk:'Yüksek',steps:['8 TL — 12 çevir','10 TL — 10 çevir','12 TL — 8 çevir','8 TL — 12 çevir'],tip:'Bu seri bittiğinde oyunu kapatıp tekrar giriş yap.'},{risk:'Orta',steps:['4 TL — 16 çevir','6 TL — 14 çevir','8 TL — 12 çevir','10 TL — 10 çevir','4 TL — 16 çevir'],tip:'Son adımdan sonra yeni strateji için yeniden giriş yap.'}],sugar:[{risk:'Orta',steps:['4 TL — 18 çevir','8 TL — 15 çevir','6 TL — 20 çevir','4 TL — 14 çevir'],tip:'Hepsini bitirdikten sonra oyundan çık ve tekrar giriş yap.'},{risk:'Orta',steps:['6 TL — 16 çevir','8 TL — 12 çevir','10 TL — 10 çevir','6 TL — 14 çevir'],tip:'Seri tamamlanınca oyunu yenile ve yeni strateji al.'},{risk:'Yüksek',steps:['4 TL — 15 çevir','6 TL — 15 çevir','8 TL — 12 çevir','10 TL — 10 çevir','4 TL — 12 çevir'],tip:'Bütün adımlar bitince oyundan çık ve sıradaki plana geç.'}]};
function pickSlotSignal(k){const pool=SLOT_STRATEGY_PRESETS[k]||SLOT_STRATEGY_PRESETS.sugar; const item=pool[Math.floor(Math.random()*pool.length)]; return {...item,stepCount:item.steps.length};}
function buildMarquee(){const c=document.getElementById('marqueeText'); const nowBucket=Math.floor(Date.now()/15000); const pick=REAL_NAME_POOL.slice(0,16); const verbs=['won','cashed out','hit','withdrew']; let h=''; pick.forEach((name,i)=>{const amt=rndInt(2000,12000); const verb=verbs[(nowBucket+i)%verbs.length]; h+=`${name} ${verb} <span>₺${amt.toLocaleString()}</span>`; if(i<pick.length-1)h+='&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';}); c.innerHTML=h+'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'+h;}
let onlineVal=247; function updOnline(){const delta=Math.floor(Math.random()*5)+1; onlineVal+=Math.random()>0.5?delta:-delta; if(onlineVal<180)onlineVal+=10; if(onlineVal>420)onlineVal-=10; document.getElementById('onlineCount').textContent='• '+onlineVal; document.getElementById('onlineCount2').textContent=onlineVal;}
let streak=parseInt(S.get('streak')||'1'); document.getElementById('streakNum').textContent=streak;
let actx=null; function playSfx(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.setValueAtTime(800,actx.currentTime);o.frequency.setValueAtTime(1200,actx.currentTime+0.1);g.gain.setValueAtTime(0.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.3);o.start();o.stop(actx.currentTime+0.3);}catch(e){}} function fireConfetti(){const box=document.getElementById('confettiBox'),cols=['#facc15','#22c55e','#3b82f6','#ef4444','#a855f7','#ec4899'];for(let i=0;i<35;i++){const p=document.createElement('div');p.className='confetti-p';p.style.left=Math.random()*100+'%';p.style.background=cols[Math.floor(Math.random()*cols.length)];p.style.animationDelay=Math.random()*.5+'s';p.style.animationDuration=(2+Math.random()*2)+'s';p.style.borderRadius=Math.random()>.5?'50%':'2px';p.style.width=(5+Math.random()*7)+'px';p.style.height=(5+Math.random()*7)+'px';box.appendChild(p);setTimeout(()=>p.remove(),4000);}}
function renderHome(){if(timer)clearInterval(timer); const app=document.getElementById('app'); app.innerHTML=`<div class="games-title">${T().cg}</div>`; const switcher=document.createElement('div'); switcher.className='segmented signal-switcher'; switcher.innerHTML=`<button class="seg-btn${signalMode==='crash'?' active':''}" id="modeCrash">${T().tabs.crash}</button><button class="seg-btn${signalMode==='slot'?' active':''}" id="modeSlot">${T().tabs.slot}</button>`; const grid=document.createElement('div'); grid.className='games-grid'; const games=signalMode==='slot'?SLOT_GAMES:['aviator','jetx','mines','penalty','balloon','chicken']; games.forEach(k=>{const g=T().g[k]; const c=document.createElement('div'); c.className='game-card'; c.onclick=()=>signalMode==='slot'?renderSlotGame(k):(k==='chicken'?renderChicken():renderGame(k)); const icon=signalMode==='slot'?(SLOT_ICONS[k]||'🎰'):(ICONS[k]||'🎮'); c.innerHTML=`<div class="game-top"><div class="game-icon">${icon}</div><div><div class="game-name">${g.n}</div><div class="game-desc">${g.d}</div></div></div><div class="game-bottom"><div class="game-play">${signalMode==='slot'?'Sinyal Al':'Oyna'}</div></div>`; grid.appendChild(c);}); app.appendChild(switcher); app.appendChild(grid); document.getElementById('modeCrash').onclick=()=>{signalMode='crash';renderHome();}; document.getElementById('modeSlot').onclick=()=>{signalMode='slot';renderHome();};}
function renderSlotGame(k){if(timer)clearInterval(timer); const app=document.getElementById('app'); const copy=T().slot,g=T().g[k]; app.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← ${T().back}</button></div><h3 class="p-title">${g.n}</h3><div class="p-sub">${copy.sub}</div><div class="stepbox slot-sell" id="slotBox"><div style="text-align:center;padding:10px 6px"><div class="slot-badge">AI SLOT SIGNAL</div><div style="font-size:42px;margin-top:10px">${SLOT_ICONS[k]||'🎰'}</div><div style="font-size:15px;font-weight:800;color:#fff;margin-top:10px">${copy.title}</div><div style="font-size:12px;color:var(--muted);margin-top:8px">${copy.loadingSub}</div></div></div><div class="btnrow"><button class="btn primary" id="slotBtn">${copy.cta}</button></div></div>`; const btn=document.getElementById('slotBtn'),box=document.getElementById('slotBox'); function updateSlotBtn(){const left=getCd('slot_'+k); if(left>0){btn.disabled=true; btn.textContent=copy.loadingTitle;} else {btn.disabled=false; btn.textContent=copy.cta;}} function renderSlotSignalCard(sig){const stepsHtml=sig.steps.map((step,idx)=>`<div class="slot-status-line"><span>${idx+1}. Adım</span><strong>${step}</strong></div>`).join(''); box.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px"><div class="slot-hero"><div class="slot-badge">AI SLOT SIGNAL</div><div class="slot-hero-icon">${SLOT_ICONS[k]||'🎰'}</div><div style="font-size:24px;font-weight:900;color:#fff;margin-top:4px">AKTİF SLOT STRATEJİSİ</div><div style="font-size:12px;color:var(--muted);margin-top:2px">Hazır plan aktif · ${sig.stepCount} adım</div></div><div style="display:grid;gap:8px"><div class="slot-status-line"><span>Risk</span><strong>${sig.risk}</strong></div><div class="slot-status-line"><span>Toplam Adım</span><strong>${sig.stepCount}</strong></div></div><div style="display:grid;gap:8px;margin-top:2px">${stepsHtml}</div><div style="margin-top:2px;padding:10px;border-radius:12px;background:rgba(255,255,255,0.05);font-size:13px;line-height:1.5;color:#fff"><span style="color:var(--muted)">Tur bitince:</span> ${sig.tip}</div></div>`;} updateSlotBtn(); timer=setInterval(updateSlotBtn,1000); btn.onclick=()=>{setCd('slot_'+k); updateSlotBtn(); box.innerHTML=`<div class="slot-analyzing"><div style="font-size:42px">${SLOT_ICONS[k]||'🎰'}</div><div style="font-size:15px;font-weight:800;color:#fff">${copy.loadingTitle}</div><div class="slot-wave"><span></span><span></span><span></span><span></span><span></span></div><div style="font-size:12px;color:var(--muted)">${copy.loadingSub}</div><div style="font-size:12px;color:var(--gold)">${copy.readyIn(10)}</div></div>`; try{navigator.vibrate&&navigator.vibrate([50,30,50]);}catch(e){} setTimeout(()=>{renderSlotSignalCard(pickSlotSignal(k)); playSfx(); updateSlotBtn();},10000);};}
function renderGame(k){if(timer)clearInterval(timer); const app=document.getElementById('app'); const gk={aviator:'av',jetx:'jx',mines:'mi',penalty:'pe',balloon:'ba'}[k]||'av'; const td=T()[gk]||T().av; let ch=`<div class="stepnum" id="cD">...</div><div class="steplabel">${td.l}</div>`; if(k==='mines'){let g='<div class="mines-grid">'; for(let i=0;i<25;i++)g+='<div class="mines-cell"></div>'; g+='</div>'; ch=g+`<div class="steplabel">${td.l}</div>`;} else if(k==='penalty'){let g='<div class="penalty-wrapper">'; for(let i=0;i<15;i++)g+='<div class="penalty-cell"></div>'; g+='</div>'; ch=g+`<div class="steplabel">${td.l}</div>`;} app.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← ${T().back}</button></div><h3 class="p-title">${td.t}</h3><div class="p-sub">${td.s}</div><div class="stepbox" id="gBox">${ch}<div class="stepnote">${td.u(hhmm(new Date()))}</div></div><div class="cd-wrap" id="cdW" style="display:none"><svg width="64" height="64"><circle class="bg" cx="32" cy="32" r="28"/><circle class="prog" id="cdP" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="0"/></svg><div class="cd-num" id="cdN">30</div></div><div class="btnrow"><button class="btn primary" id="sBtn">${td.b}</button></div>${renderSigHist(k)}</div>`; const btn=document.getElementById('sBtn'),box=document.getElementById('gBox'),cdW=document.getElementById('cdW'),cdP=document.getElementById('cdP'),cdN=document.getElementById('cdN'); const circ=175.93; function uBtn(){const l=getCd(k); if(l>0){btn.disabled=true; btn.textContent=`${T().wait} ${l}s`; cdW.style.display=''; cdP.style.strokeDashoffset=circ*(1-l/30); cdN.textContent=l;} else {btn.disabled=false; btn.textContent=td.b; cdW.style.display='none';}} function showSig(){const v=genVal(k); try{navigator.vibrate&&navigator.vibrate([50,30,50]);}catch(e){} playSfx(); addSigHist(k); if(k==='aviator'||k==='jetx'||k==='balloon'){box.innerHTML=`<div class="stepnum">${v}</div><div class="steplabel">${td.l}</div><div class="stepnote">${td.u(hhmm(new Date()))}</div>`; if(parseFloat(v)>=5)fireConfetti();} else if(k==='mines'){let g='<div class="mines-grid">'; for(let i=0;i<25;i++){const s=v.includes(i); g+=`<div class="mines-cell${s?' active':''}">${s?'⭐️':''}</div>`;} g+='</div>'; box.innerHTML=g+`<div class="steplabel">${td.l}</div><div class="stepnote">${td.u(hhmm(new Date()))}</div>`;} else if(k==='penalty'){let g='<div class="penalty-wrapper">'; for(let i=0;i<15;i++){const t=i===v; g+=`<div class="penalty-cell"><div class="${t?'penalty-ball':''}">${t?'⚽':''}</div></div>`;} g+='</div>'; box.innerHTML=g+`<div class="steplabel">${td.l}</div><div class="stepnote">${td.u(hhmm(new Date()))}</div>`;} const hEl=document.querySelector('.sig-history'); if(hEl){const tmp=document.createElement('div'); tmp.innerHTML=renderSigHist(k); if(tmp.firstChild) hEl.parentNode.replaceChild(tmp.firstChild,hEl);}} uBtn(); timer=setInterval(uBtn,1000); btn.onclick=()=>{setCd(k); showSig(); uBtn();};}
const CH_D=['easy','medium','hard','hardcore']; let chD='easy'; function renderChicken(){if(timer)clearInterval(timer); const app=document.getElementById('app'); app.innerHTML=`<div class="panel"><div class="backrow"><button class="back" id="bkB">← ${T().back}</button></div><h3 class="p-title">${T().ch.t}</h3><div class="p-sub">${T().ch.s}</div><div class="tabs" id="tabs"></div><div class="stepbox"><div class="stepnum" id="sN">-</div><div class="steplabel">STEP</div></div><div class="btnrow"><button class="btn primary" id="nxB">${T().ch.nx}</button></div></div>`; document.getElementById('bkB').onclick=renderHome; const tabs=document.getElementById('tabs'),sN=document.getElementById('sN'),nxB=document.getElementById('nxB'); function dT(){tabs.innerHTML=''; const bar=document.createElement('div'); bar.className='segmented'; CH_D.forEach(d=>{const b=document.createElement('button'); b.textContent=T().ch.tb[d]; b.className='seg-btn'+(d===chD?' active':''); b.onclick=()=>{chD=d; dT(); sN.textContent='-';}; bar.appendChild(b);}); tabs.appendChild(bar);} nxB.onclick=()=>{nxB.disabled=true; sN.textContent='...'; try{navigator.vibrate&&navigator.vibrate(50);}catch(e){} setTimeout(()=>{sN.textContent=`Adım ${rndInt(1,6)}`; nxB.disabled=false; playSfx(); addSigHist('chicken');},500);}; dT();}
buildMarquee(); updOnline(); setInterval(updOnline,4000); renderHome();
</script>
