<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Nexus Signals</title>
  <style>
    :root{--bg:#0b1020;--card:#121933;--card2:#171f3f;--text:#f5f7ff;--muted:#9ea7c7;--line:rgba(255,255,255,.08);--gold:#facc15;--gold2:#f59e0b;--green:#34d399;--red:#fb7185;--blue:#60a5fa}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:radial-gradient(circle at top,#16214a 0,#0b1020 48%,#070b16 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif}
    .app{max-width:430px;min-height:100vh;margin:0 auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}.hero{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));box-shadow:0 16px 40px rgba(0,0,0,.28)}
    .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.25);color:var(--gold);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.4px}.title{margin:12px 0 6px;font-size:28px;font-weight:900;line-height:1.05}.sub{color:var(--muted);font-size:14px;line-height:1.5}
    .switch{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch button,.back,.action{border:none;border-radius:16px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer}.switch button{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}.switch button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}
    .panel{padding:14px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--card),var(--card2))}.section-title{font-size:18px;font-weight:900;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{padding:14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;transition:.15s transform,.15s border-color}.card:active{transform:scale(.98)}.card:hover{border-color:rgba(250,204,21,.24)}.icon{font-size:28px;margin-bottom:12px}.name{font-size:16px;font-weight:900;margin-bottom:4px}.desc{font-size:12px;color:var(--muted);line-height:1.4}
    .backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);padding:10px 14px}.pill{margin-left:auto;padding:8px 12px;border-radius:999px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.2);color:var(--blue);font-size:12px;font-weight:800}
    .signal-box{padding:18px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:center}.big{font-size:44px;font-weight:900;line-height:1.05;margin:4px 0 8px}.hint{color:var(--muted);font-size:13px;line-height:1.5}.action{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}.action[disabled]{opacity:.45;cursor:not-allowed}.timer{margin-top:10px;font-size:12px;color:var(--gold);font-weight:800}
    .rows{display:grid;gap:10px;margin-top:12px;text-align:left}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px}.row span{color:var(--muted)}.row strong{color:#fff;text-align:right}.history{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}.dot{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.win{background:rgba(52,211,153,.16);color:var(--green);border:1px solid rgba(52,211,153,.22)}.lose{background:rgba(251,113,133,.14);color:var(--red);border:1px solid rgba(251,113,133,.18)}
    .loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0}.waves{display:flex;gap:6px;align-items:flex-end;height:30px}.waves span{width:7px;border-radius:999px;background:linear-gradient(180deg,var(--gold),var(--gold2));animation:w 1s ease-in-out infinite}.waves span:nth-child(2){animation-delay:.1s}.waves span:nth-child(3){animation-delay:.2s}.waves span:nth-child(4){animation-delay:.3s}.waves span:nth-child(5){animation-delay:.4s}@keyframes w{0%,100%{height:8px;opacity:.5}50%{height:28px;opacity:1}}.footer-note{font-size:12px;color:var(--muted);text-align:center;padding:2px 6px}
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="badge">⚡ LIVE SIGNALS</div>
      <div class="title">Crash + Slots</div>
      <div class="sub">Clean standalone mini app. No bot, no access checks, no tiers, no chat, no extra sections.</div>
    </div>
    <div class="switch">
      <button id="modeCrash" class="active">🚀 Crash</button>
      <button id="modeSlot">🎰 Slots</button>
    </div>
    <div id="screen"></div>
    <div class="footer-note">Standalone path only — isolated from main funnels.</div>
  </div>
  <script>
    const S={g:k=>localStorage.getItem('nx_sig_'+k),s:(k,v)=>localStorage.setItem('nx_sig_'+k,v)};
    const CRASH_GAMES=[{id:'aviator',icon:'✈️',name:'Aviator',desc:'Instant multiplier signal'},{id:'jetx',icon:'🚀',name:'JetX',desc:'Fast take-profit entry'},{id:'mines',icon:'💣',name:'Mines',desc:'Safe cells pattern'},{id:'penalty',icon:'⚽',name:'Penalty',desc:'Target shot side'},{id:'balloon',icon:'🎈',name:'Balloon',desc:'Short pop timing'},{id:'chicken',icon:'🐔',name:'Chicken Road',desc:'Run / cash-out timing'}];
    const SLOT_GAMES=[{id:'sweet',icon:'🍭',name:'Sweet Bonanza',desc:'Burst combo plan'},{id:'olympus',icon:'⚡',name:'Gate of Olympus',desc:'Volatility entry map'},{id:'sugar',icon:'🍬',name:'Sugar Rush',desc:'Short ladder strategy'}];
    const SLOT_PRESETS={sweet:[{risk:'Medium',steps:['Spin 20x at base bet','Increase x1.5 for next 10 spins if bonus tease appears','Cash stop after 1 solid tumble'],tip:'Do not chase second bonus in the same cycle.'},{risk:'Low',steps:['Start with 15 flat spins','Pause 20 seconds if screen goes cold','Re-enter with same bet for 12 spins'],tip:'Best for calm streaks.'}],olympus:[{risk:'High',steps:['Open with 10 warm-up spins','Boost x2 for 8 spins after first multiplier tease','Exit right after first strong hit'],tip:'Avoid deep chasing after two dead rounds.'},{risk:'Medium',steps:['12 base spins only','If no action, wait and retry once','Never go beyond second cycle'],tip:'Short and controlled session.'}],sugar:[{risk:'Low',steps:['Spin 18x on minimum stake','Watch for cluster build-up','Take profit on first clean sequence'],tip:'Reset immediately after one good hit.'},{risk:'Medium',steps:['10 warm-up spins','Raise x1.4 for 6 spins if grid starts connecting','Exit after first premium candy combo'],tip:'Do not extend after a dead mini-run.'}]};
    let mode='crash',timer=null; const screen=document.getElementById('screen'); const modeCrash=document.getElementById('modeCrash'); const modeSlot=document.getElementById('modeSlot');
    function choice(a){return a[Math.floor(Math.random()*a.length)]} function cooldownLeft(k){const until=parseInt(S.g('cd_'+k)||'0',10);return Math.max(0,Math.ceil((until-Date.now())/1000))} function setCooldown(k,sec){S.s('cd_'+k,String(Date.now()+sec*1000))}
    function pushHist(k,ok){let arr=[];try{arr=JSON.parse(S.g('hist_'+k)||'[]')}catch(e){} arr.unshift(!!ok); arr=arr.slice(0,8); S.s('hist_'+k,JSON.stringify(arr))}
    function getHist(k){try{return JSON.parse(S.g('hist_'+k)||'[]')}catch(e){return []}}
    function crashValue(id){if(id==='aviator')return (Math.random()*4.5+1.2).toFixed(2)+'x'; if(id==='jetx')return (Math.random()*4+1.3).toFixed(2)+'x'; if(id==='balloon')return (Math.random()*5+1.4).toFixed(2)+'x'; if(id==='mines')return choice(['Cells 3 · 7 · 12','Cells 2 · 6 · 11','Cells 5 · 9 · 14','Cells 1 · 8 · 13']); if(id==='penalty')return choice(['Left corner','Right corner','Center fake → left']); return choice(['Exit at bridge 2.4x','Run short to 1.9x','Safe cash-out 2.1x'])}
    function slotSignal(id){const p=choice(SLOT_PRESETS[id]); return {...p,steps:[...p.steps]}}
    function historyHtml(id){const h=getHist(id); if(!h.length) return ''; return `<div class="history">${h.map(v=>`<div class="dot ${v?'win':'lose'}">${v?'✓':'•'}</div>`).join('')}</div>`}
    function renderHome(){clearInterval(timer); timer=null; const games=mode==='crash'?CRASH_GAMES:SLOT_GAMES; screen.innerHTML=`<div class="panel"><div class="section-title">${mode==='crash'?'Crash signals':'Slot strategies'}</div><div class="grid">${games.map(g=>`<div class="card" onclick="openGame('${g.id}')"><div class="icon">${g.icon}</div><div class="name">${g.name}</div><div class="desc">${g.desc}</div></div>`).join('')}</div></div>`}
    function openGame(id){mode==='crash'?renderCrash(id):renderSlot(id)}
    function renderCrash(id){clearInterval(timer); timer=null; const g=CRASH_GAMES.find(x=>x.id===id); screen.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← Back</button><div class="pill">Crash signal</div></div><div class="section-title">${g.icon} ${g.name}</div><div class="signal-box" id="box"><div class="big">READY</div><div class="hint">Tap the button and get the next signal.</div>${historyHtml(id)}</div><button class="action" id="btn">Get signal</button><div class="timer" id="tm"></div></div>`; const btn=document.getElementById('btn'), tm=document.getElementById('tm'), box=document.getElementById('box');
      function syncBtn(){const left=cooldownLeft(id); if(left>0){btn.disabled=true; btn.textContent='Wait'; tm.textContent='Cooldown: '+left+'s';} else {btn.disabled=false; btn.textContent='Get signal'; tm.textContent='';}}
      btn.onclick=()=>{if(cooldownLeft(id)>0)return; const val=crashValue(id); const win=Math.random()>0.22; pushHist(id,win); box.innerHTML=`<div class="big">${val}</div><div class="hint">Generated ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div class="rows"><div class="row"><span>Signal</span><strong>${val}</strong></div><div class="row"><span>Risk</span><strong>${choice(['Low','Medium','Medium-High'])}</strong></div><div class="row"><span>Note</span><strong>${choice(['Take first clean exit','Do not chase after one miss','Short session only'])}</strong></div></div>${historyHtml(id)}`; setCooldown(id,30); syncBtn()}; syncBtn(); timer=setInterval(syncBtn,1000)}
    function renderSlot(id){clearInterval(timer); timer=null; const g=SLOT_GAMES.find(x=>x.id===id); screen.innerHTML=`<div class="panel"><div class="backrow"><button class="back" onclick="renderHome()">← Back</button><div class="pill">Slot strategy</div></div><div class="section-title">${g.icon} ${g.name}</div><div class="signal-box" id="box"><div class="loading"><div style="font-size:40px">${g.icon}</div><div class="hint">Run analysis and generate a fresh slot plan.</div>${historyHtml(id)}</div></div><button class="action" id="btn">Generate strategy</button><div class="timer" id="tm"></div></div>`; const btn=document.getElementById('btn'), tm=document.getElementById('tm'), box=document.getElementById('box');
      function syncBtn(){const left=cooldownLeft(id); if(left>0){btn.disabled=true; btn.textContent='Analyzing'; tm.textContent='Cooldown: '+left+'s';} else {btn.disabled=false; btn.textContent='Generate strategy'; tm.textContent='';}}
      btn.onclick=()=>{if(cooldownLeft(id)>0)return; btn.disabled=true; btn.textContent='Analyzing'; box.innerHTML=`<div class="loading"><div style="font-size:40px">${g.icon}</div><div class="waves"><span></span><span></span><span></span><span></span><span></span></div><div class="hint">Scanning pattern, volatility and entry timing...</div></div>`; setTimeout(()=>{const sig=slotSignal(id); const win=Math.random()>0.2; pushHist(id,win); setCooldown(id,10); box.innerHTML=`<div class="big">PLAN READY</div><div class="rows"><div class="row"><span>Risk</span><strong>${sig.risk}</strong></div>${sig.steps.map((s,i)=>`<div class="row"><span>Step ${i+1}</span><strong>${s}</strong></div>`).join('')}<div class="row"><span>Finish</span><strong>${sig.tip}</strong></div></div>${historyHtml(id)}`; syncBtn()},10000)}; syncBtn(); timer=setInterval(syncBtn,1000)}
    modeCrash.onclick=()=>{mode='crash'; modeCrash.classList.add('active'); modeSlot.classList.remove('active'); renderHome()}; modeSlot.onclick=()=>{mode='slot'; modeSlot.classList.add('active'); modeCrash.classList.remove('active'); renderHome()}; renderHome();
  </script>
</body>
</html>
