<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>NexusAI Signals</title>
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#080c18;--bg2:#0d1324;--bg3:#111827;
      --stroke:rgba(255,255,255,0.06);--stroke2:rgba(255,255,255,0.1);
      --text:#eef2ff;--muted:#7c85a3;--muted2:#4b5270;
      --gold:#facc15;--gold2:#eab308;--gold-glow:rgba(250,204,21,0.35);
      --green:#22c55e;--green-glow:rgba(34,197,94,0.3);
      --red:#ef4444;--blue:#3b82f6;
      --r1:24px;--r2:16px;--pill:999px;
      --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow-x:hidden;}
    body{
      font-family:'Outfit',system-ui,-apple-system,sans-serif;
      color:var(--text);
      background:var(--bg);
      -webkit-tap-highlight-color:transparent;
    }
    body.rtl{direction:rtl;}
    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px;}
    .app-wrap{
      max-width:480px;margin:0 auto;height:100%;overflow-y:auto;
      padding:calc(12px + var(--safeT)) 16px calc(120px + var(--safeB));
      position:relative;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
    }
    .top-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 0 12px;
    }
    .top-left{display:flex;align-items:center;gap:8px;}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:livePulse 2s infinite;}
    @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green);}50%{opacity:.5;box-shadow:0 0 3px var(--green);}}
    .live-text{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;}
    .online-count{font-size:11px;color:var(--muted);font-weight:600;}
    .top-right{display:flex;align-items:center;gap:8px;}
    .tg-id{font-size:11px;font-weight:700;color:var(--blue);background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.15);padding:3px 10px;border-radius:var(--pill);}.self-reset-btn{display:none;align-items:center;justify-content:center;height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.12);color:#ff8a8a;font-size:11px;font-weight:800;cursor:pointer;gap:6px}.self-reset-btn:disabled{opacity:.6;cursor:default}
    .lang-drop{position:relative;display:none;}
    .lang-btn{background:rgba(255,255,255,0.05);border:1px solid var(--stroke2);border-radius:10px;padding:4px 10px;color:var(--gold);font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;}
    .lang-btn::after{content:'▾';font-size:10px;color:var(--muted);}
    .lang-menu{position:absolute;top:110%;right:0;background:var(--bg3);border:1px solid var(--stroke2);border-radius:12px;padding:4px;z-index:500;display:none;min-width:80px;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
    .lang-menu.open{display:block;}
    .lang-opt{display:block;width:100%;padding:6px 12px;background:none;border:none;color:var(--muted);font-weight:700;font-size:12px;text-align:left;cursor:pointer;border-radius:8px;font-family:inherit;}
    .lang-opt:hover,.lang-opt.active{background:rgba(250,204,21,0.1);color:var(--gold);}
    .meta-bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0 4px;}
    .meta-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--pill);background:rgba(255,255,255,0.04);border:1px solid var(--stroke);font-size:11px;font-weight:700;}
    .meta-pill .icon{font-size:13px;}
    .meta-pill .val{color:#fff;font-weight:800;}
    .vip-card{margin:0 16px 12px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(255,215,0,0.02));border:1px solid rgba(255,215,0,0.2);position:relative;overflow:hidden;}
    .vip-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,215,0,0.15),transparent);border-radius:50%;}
    .vip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .vip-badge{display:flex;align-items:center;gap:8px;}
    .vip-badge-icon{font-size:28px;}
    .vip-badge-info{display:flex;flex-direction:column;}
    .vip-badge-tier{font-size:15px;font-weight:800;color:#fff;}
    .vip-badge-acc{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px;}
    .vip-next{text-align:right;}
    .vip-next-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .vip-next-tier{font-size:12px;font-weight:700;color:var(--gold);}
    .vip-progress{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);margin-top:4px;overflow:hidden;}
    .vip-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 0.6s ease;}
    .vip-progress-text{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--muted);font-weight:600;}
    .games-title{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .game-card{border-radius:var(--r2);padding:16px 14px;cursor:pointer;position:relative;overflow:hidden;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--stroke);backdrop-filter:blur(12px);transition:transform 0.15s,box-shadow 0.2s;}
    .game-card:active{transform:scale(0.97);}
    .game-card:hover{box-shadow:0 8px 30px rgba(0,0,0,0.4);}
    .game-card[data-game="aviator"]{background:linear-gradient(145deg,rgba(239,68,68,0.12),rgba(15,23,42,0.8));border-color:rgba(239,68,68,0.15);}
    .game-card[data-game="jetx"]{background:linear-gradient(145deg,rgba(245,158,11,0.12),rgba(15,23,42,0.8));border-color:rgba(245,158,11,0.15);}
    .game-card[data-game="mines"]{background:linear-gradient(145deg,rgba(59,130,246,0.12),rgba(15,23,42,0.8));border-color:rgba(59,130,246,0.15);}
    .game-card[data-game="penalty"]{background:linear-gradient(145deg,rgba(34,197,94,0.12),rgba(15,23,42,0.8));border-color:rgba(34,197,94,0.15);}
    .game-card[data-game="balloon"]{background:linear-gradient(145deg,rgba(168,85,247,0.12),rgba(15,23,42,0.8));border-color:rgba(168,85,247,0.15);}
    .game-card[data-game="chicken"]{background:linear-gradient(145deg,rgba(251,146,60,0.12),rgba(15,23,42,0.8));border-color:rgba(251,146,60,0.15);}    .game-card[data-game="sweet"]{background:linear-gradient(145deg,rgba(236,72,153,0.24),rgba(124,58,237,0.16),rgba(15,23,42,0.88));border-color:rgba(244,114,182,0.34);box-shadow:0 10px 30px rgba(236,72,153,0.12);}    .game-card[data-game="gates"]{background:linear-gradient(145deg,rgba(250,204,21,0.24),rgba(59,130,246,0.14),rgba(15,23,42,0.88));border-color:rgba(250,204,21,0.34);box-shadow:0 10px 30px rgba(250,204,21,0.12);}    .game-card[data-game="sugar"]{background:linear-gradient(145deg,rgba(244,114,182,0.2),rgba(45,212,191,0.14),rgba(15,23,42,0.88));border-color:rgba(45,212,191,0.28);box-shadow:0 10px 30px rgba(45,212,191,0.12);}    .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px;}    .seg-btn{height:42px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#cbd5e1;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}    .seg-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0f1e;box-shadow:0 8px 20px rgba(250,204,21,0.18);}    .signal-switcher{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px;}    .signal-switcher .seg-btn{height:48px;border-radius:16px;font-size:15px;font-weight:900;letter-spacing:.2px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);}    .signal-switcher .seg-btn:first-child.active{background:linear-gradient(135deg,#fb7185,#ef4444);box-shadow:0 10px 24px rgba(239,68,68,0.28);}    .signal-switcher .seg-btn:last-child.active{background:linear-gradient(135deg,#facc15,#eab308);box-shadow:0 10px 24px rgba(250,204,21,0.26);}    .slot-analyzing{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 4px;}    .slot-wave{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:34px;}    .slot-wave span{width:8px;border-radius:999px;background:linear-gradient(180deg,var(--gold),#f59e0b);animation:slotPulse 1s ease-in-out infinite;}    .slot-wave span:nth-child(1){height:12px;animation-delay:0s}.slot-wave span:nth-child(2){height:24px;animation-delay:.15s}.slot-wave span:nth-child(3){height:18px;animation-delay:.3s}.slot-wave span:nth-child(4){height:28px;animation-delay:.45s}.slot-wave span:nth-child(5){height:14px;animation-delay:.6s}    @keyframes slotPulse{0%,100%{transform:scaleY(.55);opacity:.45}50%{transform:scaleY(1.15);opacity:1}}    .slot-status-line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);}    .slot-status-line span{color:var(--muted);font-size:12px;}    .slot-status-line strong{color:#fff;font-size:13px;}    .slot-sell{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(250,204,21,0.12),rgba(255,255,255,0.03));border:1px solid rgba(250,204,21,0.14);box-shadow:0 14px 34px rgba(0,0,0,0.22);}    .slot-sell::before{content:"";position:absolute;inset:-30% auto auto -10%;width:180px;height:180px;background:radial-gradient(circle,rgba(250,204,21,0.16),transparent 65%);pointer-events:none;}    .slot-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(250,204,21,0.12);border:1px solid rgba(250,204,21,0.18);font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;}    .slot-hero{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08);}    .slot-hero-icon{width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 12px 24px rgba(0,0,0,0.24);}    .slot-hero-enter{box-shadow:0 0 24px rgba(34,197,94,0.18);}    .slot-mini-pill{display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,0.05);color:#dbe3f4;border:1px solid rgba(255,255,255,0.06);}    .slot-lock-sell{margin-top:10px;padding:12px;border-radius:14px;background:linear-gradient(145deg,rgba(250,204,21,0.1),rgba(255,255,255,0.03));border:1px solid rgba(250,204,21,0.16);text-align:left;}
    .game-top{display:flex;align-items:center;gap:10px;}
    .game-icon{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--stroke2);flex-shrink:0;}
    .game-name{font-size:15px;font-weight:800;color:#fff;line-height:1.1;}
    .game-desc{font-size:10px;color:var(--muted2);font-weight:600;margin-top:2px;}
    .game-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .game-play{font-size:11px;color:var(--muted2);font-weight:700;display:flex;align-items:center;gap:3px;}
    .game-play::after{content:'▶';font-size:8px;}
    .locked-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(8,12,24,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);text-align:center;padding:10px;border-radius:var(--r2);}
    .lock-icon{font-size:28px;margin-bottom:6px;}
    .lock-text{color:var(--red);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px;}
    .lock-msg{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.3;}
    .panel{margin-top:12px;border-radius:var(--r2);border:1px solid var(--stroke);background:rgba(13,19,36,0.8);padding:16px;backdrop-filter:blur(8px);}
    .backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .back{border:1px solid var(--stroke);background:rgba(255,255,255,0.04);color:var(--muted);padding:8px 14px;border-radius:var(--pill);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
    .p-title{font-size:22px;font-weight:900;color:#fff;}
    .p-sub{margin-top:4px;color:var(--muted);font-size:13px;}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
    .btn{flex:1;min-width:140px;padding:14px;border-radius:14px;border:none;background:rgba(255,255,255,0.06);color:#fff;font-weight:800;cursor:pointer;font-size:14px;font-family:inherit;transition:transform .1s;}
    .btn:active{transform:scale(0.97);}
    .btn.primary{color:#0a0f1e;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 20px var(--gold-glow);}
    .btn[disabled]{opacity:0.4;cursor:not-allowed;background:#1e293b;color:var(--muted);box-shadow:none;}
    .stepbox{margin-top:14px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,0.02);padding:20px;text-align:center;}
    .stepnum{font-size:52px;font-weight:900;color:var(--gold);text-shadow:0 0 20px var(--gold-glow);}
    .steplabel{color:var(--muted2);font-weight:800;letter-spacing:1.5px;font-size:11px;text-transform:uppercase;margin-top:4px;}
    .stepnote{margin-top:10px;color:var(--muted);font-size:12px;}
    .sig-history{margin-top:14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,0.15);padding:10px 12px;}
    .sig-history-title{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .sig-history-row{display:flex;gap:4px;flex-wrap:wrap;}
    .sig-dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid var(--stroke);}
    .sig-dot.win{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.25);color:var(--green);}
    .sig-dot.lose{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.15);color:var(--red);}
    .cd-wrap{margin:12px auto;width:64px;height:64px;position:relative;}
    .cd-wrap svg{transform:rotate(-90deg);}
    .cd-wrap circle{fill:none;stroke-width:4;}
    .cd-wrap .bg{stroke:rgba(255,255,255,0.04);}
    .cd-wrap .prog{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
    .cd-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;font-weight:900;color:var(--gold);}
    .mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:280px;margin:16px auto;}
    .mines-cell{aspect-ratio:1;background:rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--stroke);}
    .mines-cell.active{background:var(--gold);box-shadow:0 0 12px var(--gold-glow);border-color:#fff;animation:popIn .3s ease;}
    .penalty-wrapper{width:100%;max-width:300px;height:180px;margin:16px auto;border:3px solid rgba(255,255,255,0.2);border-bottom:none;background:rgba(0,0,0,0.15);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);border-radius:8px 8px 0 0;}
    .penalty-cell{border:1px dashed rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;}
    .penalty-ball{font-size:22px;animation:popIn .3s cubic-bezier(.175,.885,.32,1.275);}
    @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    .tabs{margin-top:14px;}
    .confetti-box{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9000;overflow:hidden;}
    .confetti-p{position:absolute;top:-10px;animation:cFall 3s ease-in forwards;}
    @keyframes cFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
    .marquee-wrap{position:absolute;left:0;right:0;bottom:0;width:100%;background:var(--bg);border-top:1px solid rgba(250,204,21,0.15);padding:7px 0;z-index:200;overflow:hidden;white-space:nowrap;}
    .marquee-inner{display:inline-block;animation:mqScroll 120s linear infinite;font-size:11px;font-weight:600;color:var(--muted);will-change:transform;}
    .marquee-inner span{color:var(--gold);font-weight:800;}
    @keyframes mqScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    #splash{display:none !important;}
    #geoScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:8000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    #geoScreen.open{display:flex;}
    .geo-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;}
    .geo-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
    .geo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px;}
    .geo-btn{display:flex;align-items:center;gap:10px;padding:16px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid var(--stroke2);cursor:pointer;transition:all .2s;font-family:inherit;}
    .geo-btn:active{transform:scale(0.96);}
    .geo-btn:hover{border-color:var(--gold);background:rgba(250,204,21,0.06);}
    .geo-flag{font-size:28px;}
    .geo-name{font-size:14px;font-weight:700;color:#fff;}
    .reg-btn{margin-top:8px;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0f1e;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
    .promo-text{margin-top:4px;font-size:10px;color:var(--gold);font-weight:700;}
    .app-shell{position:fixed;inset:0;max-width:480px;width:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;height:100dvh;}
    .app-body{flex:1;min-height:0;position:relative;overflow:hidden;}
    .tab-bar{position:relative;left:auto;right:auto;bottom:auto;width:100%;height:56px;background:#060a14;border-top:1px solid rgba(250,204,21,0.15);display:flex;align-items:center;justify-content:center;z-index:300;box-shadow:0 -8px 30px rgba(0,0,0,0.5);flex-shrink:0;}
    .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted2);transition:all .2s;border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;}
    .tab-item.active{color:var(--gold);}
    .tab-item .tab-icon{font-size:20px;line-height:1;}
    .tab-item .tab-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
    .tab-content{display:none;height:100%;}
    .tab-content.active{display:block;}
    #tabChat{height:100%;background:var(--bg);display:none;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden;position:relative;}
    #tabChat.active{display:grid !important;}
    .chat-header{padding:calc(8px + var(--safeT)) 16px 4px;flex-shrink:0;background:var(--bg);}
    .chat-box{min-height:0;height:100%;overflow:hidden;display:flex;flex-direction:column;padding:0 16px 0;}
    .chat-msgs{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;min-height:0;max-height:100%;overscroll-behavior:contain;}
    .msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-wrap:break-word;animation:msgIn .3s ease;}

    const REPLY_KR=['ㅋㅋㅋ','ㄹㅇ','나도','진짜','대박','ㅇㅇ','맞아','인정','그거 맞음','좋다'];
    function pickReply(seed){return REPLY_KR[Math.floor(sRng(seed)*REPLY_KR.length)];}
    function msgForSlot(slot){const npcIdx=Math.floor(sRng(slot*7+1)*LIVE_ROOM_NPCS.length);const npc=LIVE_ROOM_NPCS[npcIdx];const ts=new Date(slot*SLOT_SEC*1000).toISOString();const isReply=sRng(slot*13+5)<0.28;if(isReply){const prevNpcIdx=Math.floor(sRng((slot-1)*7+1)*LIVE_ROOM_NPCS.length);const prevNpc=LIVE_ROOM_NPCS[prevNpcIdx];return {author:npc.name,badge:npc.badge,text:'@'+prevNpc.name+' '+pickReply(slot*7+9),createdAt:ts,role:'npc',reactions:[]};}return {author:npc.name,badge:npc.badge,text:pickText(slot*7+2),createdAt:ts,role:'npc',reactions:[]};}
    let lastSlot=0;
    function seedLiveRoomLocal(){const now=slotNow();if(liveRoomFeed.length&&lastSlot===now)return;if(!liveRoomFeed.length){for(let i=0;i<80;i++){liveRoomFeed.push(msgForSlot(now-80+1+i));}lastSlot=now;}else if(now>lastSlot){for(let s=lastSlot+1;s<=now;s++){liveRoomFeed.push(msgForSlot(s));}if(liveRoomFeed.length>150)liveRoomFeed.splice(0,liveRoomFeed.length-150);lastSlot=now;}}
    function roomBadgeIcon(b){return (b||'').toLowerCase().includes('gold')?'🥇':'';}
    function roomNameClass(name){const s=(name||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%6;return ['c1','c2','c3','c4','c5','c6'][s];}
    function roomReplyTarget(text){const m=String(text||'').match(/^@([^\s,:!?]+)/);return m?m[1]:'';}
    const ROOM_REACT_EMOJIS=['🔥','💰','😂','🎯','👀','🙌','😭','🤑','💎'];
    function renderReactions(msg){if(!msg.reactions||!msg.reactions.length)return '';return '<span class="room-reactions">'+msg.reactions.map(r=>`<span class="room-reaction">${r.e}<span class="rcount">${r.c}</span></span>`).join('')+'</span>';}
    let reactDripTimer=null;
    function startReactDrip(){if(reactDripTimer)return;reactDripTimer=setInterval(()=>{if(!liveRoomFeed.length)return;const idx=Math.floor(Math.random()*liveRoomFeed.length);const m=liveRoomFeed[idx];if(m.role==='user')return;if(!m.reactions)m.reactions=[];const em=ROOM_REACT_EMOJIS[Math.floor(Math.random()*ROOM_REACT_EMOJIS.length)];const existing=m.reactions.find(r=>r.e===em);if(existing){existing.c++;}else{if(m.reactions.length>=3)return;m.reactions.push({e:em,c:1});}if(curTab==='liveRoom'){const feed=document.getElementById('liveRoomFeed');if(!feed)return;const el=feed.children[idx];if(!el)return;const old=el.querySelector('.room-reactions');if(old)old.remove();const html=renderReactions(m);if(html){const tmp=document.createElement('span');tmp.innerHTML=html;el.appendChild(tmp.firstChild);}}},3500);}
    let roomTickerStarted=false,roomTickerTimer=null,roomTypingTimer=null;
    function startRoomTicker(){if(roomTickerStarted)return;roomTickerStarted=true;startReactDrip();roomTickerTimer=setInterval(()=>{const now=slotNow();if(now>lastSlot){const nextMsg=msgForSlot(now);const tyEl=document.getElementById('roomTyping');if(tyEl&&curTab==='liveRoom'){tyEl.innerHTML=`${nextMsg.author} 입력 중<span class="dots"><span>.</span><span>.</span><span>.</span></span>`;if(roomTypingTimer)clearTimeout(roomTypingTimer);roomTypingTimer=setTimeout(()=>{tyEl.innerHTML='';},2000);}seedLiveRoomLocal();if(curTab==='liveRoom')renderLiveRoom(true);}},3000);}
    let roomRenderedCount=0;
    function linkify(text){return text.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:#4fc3f7;text-decoration:underline;word-break:break-all">$1</a>').replace(/\b(777[A-Z]{2}777)\b/g,'<span onclick="navigator.clipboard.writeText(\'$1\');this.style.background=\'#4fc3f7\';this.textContent=\'복사됨!\';setTimeout(()=>{this.textContent=\'$1\';this.style.background=\'rgba(79,195,247,0.15)\'},1200)" style="background:rgba(79,195,247,0.15);color:#4fc3f7;padding:2px 8px;border-radius:6px;font-weight:700;font-family:monospace;cursor:pointer;display:inline-block;border:1px dashed rgba(79,195,247,0.4)">$1</span>');}
    function buildMsgEl(m){const el=document.createElement('div');el.className='room-msg'+(m.role==='user'?' user':'');const rt=roomReplyTarget(m.text);const cleanText=rt?String(m.text).replace(new RegExp('^@'+rt+'\\s*'),''):m.text;const bi=roomBadgeIcon(m.badge);el.innerHTML=`${rt?`<div class="room-reply">↳ ${rt}에게 답장</div>`:''}<span class="room-name ${roomNameClass(m.author)}">${m.author}</span>${bi?`<span class="room-badge">${bi}</span>`:''}<span class="room-text">${linkify((cleanText||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))}</span><span class="room-time">${roomRelTime(m.createdAt)}</span>${renderReactions(m)}`;return el;}
    function renderLiveRoom(appendOnly){seedLiveRoomLocal();const feed=document.getElementById('liveRoomFeed');if(!feed)return;const lock=document.getElementById('liveRoomLock');const comp=document.getElementById('liveRoomComposer');const unlocked=liveRoomUnlocked();lock.style.display=unlocked?'none':'block';comp.style.display=unlocked?'flex':'none';if(!appendOnly||roomRenderedCount===0){feed.innerHTML='';roomRenderedCount=0;for(let i=0;i<liveRoomFeed.length;i++){feed.appendChild(buildMsgEl(liveRoomFeed[i]));}roomRenderedCount=liveRoomFeed.length;}else{for(let i=roomRenderedCount;i<liveRoomFeed.length;i++){feed.appendChild(buildMsgEl(liveRoomFeed[i]));}roomRenderedCount=liveRoomFeed.length;}feed.scrollTop=feed.scrollHeight;startRoomTicker();}
    async function sendLiveRoomMessage(){if(!liveRoomUnlocked())return;const inp=document.getElementById('liveRoomInput');const txt=(inp.value||'').trim();if(!txt)return;liveRoomFeed.push({author:userName||'나',badge:getVipTier().name,text:txt,createdAt:new Date().toISOString(),role:'user',reactions:[]});inp.value='';renderLiveRoom(true);} 
    document.addEventListener('keydown',function(e){if(curTab==='liveRoom'&&e.key==='Enter'&&!e.shiftKey&&document.activeElement&&document.activeElement.id==='liveRoomInput'){e.preventDefault();sendLiveRoomMessage();}});

    let chatH=[],chatLD=false,chatImgB64=null;
    function handleChatImage(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){chatImgB64=e.target.result;const prev=document.getElementById('chatImgPreview');prev.style.display='block';prev.innerHTML=`<div class="chat-img-preview"><img src="${chatImgB64}"><button class="chat-img-remove" onclick="removeChatImage()">✕</button></div>`;};reader.readAsDataURL(file);input.value='';}
    function removeChatImage(){chatImgB64=null;document.getElementById('chatImgPreview').style.display='none';document.getElementById('chatImgPreview').innerHTML='';}
    function scrollChatBottom(){const e=document.getElementById('chatMessages');if(e)e.scrollTop=e.scrollHeight;}
    function chatVipBanner(){const tier=getVipTier();const idx=getVipTierIdx();const dep=parseInt(S.get('totalDep')||'0');let hint='';if(idx<VIP_TIERS.length-1){const next=VIP_TIERS[idx+1];const remain=next.dep-dep;hint=`<div style="font-size:10px;color:var(--muted);margin-top:2px">₩${remain.toLocaleString()} 추가 시 ${next.icon} ${next.name} (${next.acc}%)</div>`;}return `<div style="text-align:center;padding:8px;margin-bottom:4px;background:rgba(255,215,0,0.06);border-radius:10px;border:1px solid rgba(255,215,0,0.15)"><span style="font-size:18px">${tier.icon}</span> <span style="font-size:13px;font-weight:800;color:#fff">${tier.name}</span> <span style="font-size:11px;color:var(--gold);font-weight:700">정확도 ${tier.acc}%</span>${hint}</div>`;}
    function renderChat(){const e=document.getElementById('chatMessages');if(!chatH.length){if(chatTier===2){e.innerHTML='<div class="chat-welcome"><div class="chat-welcome-icon" style="display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#facc15" opacity="0.15"/><circle cx="20" cy="20" r="12" fill="#facc15" opacity="0.25"/><circle cx="20" cy="20" r="6" fill="#facc15"/><line x1="20" y1="2" x2="20" y2="8" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="32" x2="20" y2="38" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="20" x2="8" y2="20" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/><line x1="32" y1="20" x2="38" y2="20" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="chat-welcome-title" style="color:var(--gold)">NexusAI 개인 분석가</div><div class="chat-welcome-text">계정이 활성화되었습니다. 이제 전담 AI 분석가가 실시간으로 수익 극대화를 도와드립니다.</div></div>';}else{e.innerHTML='<div class="chat-welcome"><div class="chat-welcome-icon" style="display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#facc15" opacity="0.15"/><circle cx="20" cy="20" r="12" fill="#facc15" opacity="0.25"/><circle cx="20" cy="20" r="6" fill="#facc15"/><line x1="20" y1="2" x2="20" y2="8" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="32" x2="20" y2="38" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="20" x2="8" y2="20" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/><line x1="32" y1="20" x2="38" y2="20" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="chat-welcome-title">NexusAI 지원팀</div><div class="chat-welcome-text">앱 사용법과 설정을 도와드립니다. 개인 AI 분석가는 골드 티어에서 해제됩니다.</div></div>';}return;}e.innerHTML=chatVipBanner();chatH.forEach(m=>{const d=document.createElement('div');d.className=`msg ${m.r==='user'?'user':'bot'}`;const hasHtml=m.t.includes('<img');if(hasHtml){d.innerHTML=m.t+(m.tm?`<div class="msg-time">${m.tm}</div>`:'');}else if(m.r==='bot'){d.innerHTML=linkify(m.t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))+(m.tm?`<div class="msg-time">${m.tm}</div>`:'');}else{d.textContent=m.t;if(m.tm){const tm=document.createElement('div');tm.className='msg-time';tm.textContent=m.tm;d.appendChild(tm);}}e.appendChild(d);});scrollChatBottom();}
    async function loadChatHistory(){if(chatLD)return;chatLD=true;try{const raw=S.get('nexusaii_chat_in');if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length){chatH=arr;renderChat();}}}catch(e){}const uid=String(tgUserId||S.get('tg_user_id')||'');if(!uid)return;try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);const r=await fetch(CHAT_HISTORY_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,geo:'kr'}),signal:controller.signal});clearTimeout(timeout);const d=await r.json();if(d.messages&&Array.isArray(d.messages)&&d.messages.length){chatH=d.messages.map(m=>({r:m.role==='user'?'user':'bot',t:m.content||m.text||'',tm:m.time||''}));try{S.set('nexusaii_chat_in',JSON.stringify(chatH.slice(-40)));}catch(e){}renderChat();}}catch(e){}}

    let _lastSendTs=0,_lastSendTxt='',_sendLock=false;
    async function sendChatMessage(){if(_sendLock)return;const now=Date.now();const inp=document.getElementById('chatInput'),txt=inp.value.trim();if(!txt&&!chatImgB64)return;if(txt===_lastSendTxt&&now-_lastSendTs<5000)return;_sendLock=true;_lastSendTs=now;_lastSendTxt=txt;document.getElementById('chatSendBtn').disabled=true;const displayMsg=chatImgB64?`${txt?txt+'<br>':''}<img src="${chatImgB64}">`:(txt);chatH.push({r:'user',t:displayMsg,tm:hhmm(new Date())});inp.value='';inp.style.height='auto';const imgPayload=chatImgB64;removeChatImage();renderChat();const el=document.getElementById('chatMessages'),tp=document.createElement('div');tp.className='msg typing';tp.id='tpI';tp.textContent='NexusAI가 입력 중...';el.appendChild(tp);scrollChatBottom();let botText='문제가 발생했습니다. 다시 시도해주세요.';try{const uid=String(tgUserId||S.get('tg_user_id')||'');const body={user_id:uid,message:txt||'[image]',first_name:userName||'User',mode:accessMode,total_deposit:userTotalDeposit,chat_tier:chatTier,geo:'kr'};if(imgPayload)body.image=imgPayload;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),30000);const r=await fetch(CHAT_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});clearTimeout(timeout);const d=await r.json();if(d.reply)botText=d.reply;else if(d.message)botText=d.message;else if(d.text)botText=d.text;}catch(e){if(e.name==='AbortError')botText='응답 시간이 초과되었습니다. 다시 시도해주세요.';}document.getElementById('tpI')?.remove();chatH.push({r:'bot',t:botText,tm:hhmm(new Date())});try{S.set('nexusaii_chat_in',JSON.stringify(chatH.slice(-40)));}catch(e){}renderChat();_sendLock=false;document.getElementById('chatSendBtn').disabled=false;}

    function sRnd(s){let x=Math.sin(s)*10000;return x-Math.floor(x);} 
    function getWeekSeed(){const d=new Date(),y=d.getFullYear(),jan1=new Date(y,0,1),days=Math.floor((d-jan1)/864e5),week=Math.ceil((days+jan1.getDay()+1)/7);return y*100+week;}
    function genTop(){const ws=getWeekSeed();const baseNames=[...new Set(MALAYSIA_NAME_POOL.map(x=>String(x).trim()).filter(Boolean))];while(baseNames.length<100){baseNames.push(`Player${baseNames.length+1}`);}const gn=['Aviator','JetX','Mines','Chicken','Balloon','Penalty'];const ordered=baseNames.slice(0,100);const p=[];let prevAmt=10500;for(let i=0;i<100;i++){const r2=sRnd(ws+i*17+7),r3=sRnd(ws+i*23+11);const nm=ordered[i];const gm=gn[Math.floor(r2*gn.length)];const base=10200*Math.pow(0.952,i);const jitter=(r3-0.5)*base*0.15;let am=Math.round(base+jitter);am=Math.min(am,prevAmt-Math.floor(r3*30+10));am=Math.max(am,50);prevAmt=am;p.push({rk:i+1,nm,gm,am});}return p;}
    function renderTopPlayers(){const d=new Date(),ds=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',year:'numeric'});document.getElementById('topDate').textContent=`📅 ${ds} 주간`;const p=genTop(),pd=document.getElementById('topPodium'),md=['🥇','🥈','🥉'],od=[1,0,2];pd.innerHTML=od.map(i=>`<div class="podium-item"><div class="podium-avatar">${md[i]}</div><div class="podium-name">${p[i].nm}</div><div class="podium-amount">$${p[i].am.toLocaleString()}</div></div>`).join('');document.getElementById('topList').innerHTML=p.map(x=>`<div class="top-row"><div class="top-rank">${x.rk<=3?['🥇','🥈','🥉'][x.rk-1]:'#'+x.rk}</div><div class="top-name">${x.nm}</div><div class="top-game">${x.gm}</div><div class="top-amount">+$${x.am.toLocaleString()}</div></div>`).join('');}

    const HELP_DATA={
      streak:{title:'🔥 연속 접속',text:'매일 앱에 접속하면 연속 기록이 쌓입니다. 골드 회원은 연속 기록이 높을수록 더 향상된 시그널 정확도를 받습니다.'},
      vip:{title:'🏅 VIP 티어',text:'입금 수준에 따라 계정에 배정되는 AI 서버 자원이 달라집니다.\n\n🥉 브론즈 (₩80,000) — 하루 5회 시그널, 정확도 90%\n🥇 골드 (₩150,000) — 무제한 시그널, 정확도 95% + 24/7 개인 AI 분석가\n\n입금이 클수록 더 많은 자원이 배정되어 더 좋은 시그널과 더 큰 수익 기회를 제공합니다 🤝'},
      profit:{title:'💰 오늘 수익',text:'오늘 시그널을 따라가며 얻은 총 수익입니다. 자정마다 초기화됩니다.'},
      winrate:{title:'📊 적중률',text:'해당 게임의 AI 예측 정확도입니다. 수천 개의 라운드 분석 데이터를 기반으로 합니다.'}
    };
    function showHelp(key){const d=HELP_DATA[key];if(!d)return;const ov=document.createElement('div');ov.className='help-overlay';const tt=document.createElement('div');tt.className='help-tooltip';tt.innerHTML=`<div class="help-tooltip-title">${d.title}</div><div>${d.text}</div>`;document.body.appendChild(ov);document.body.appendChild(tt);function close(){ov.remove();tt.remove();}ov.onclick=close;tt.onclick=close;}

    function initApp(){try{window.trackIndiaEvent&&window.trackIndiaEvent('MiniAppOpen',{geo:'KR',lang:'ko'});}catch(e){}lang='ko';S.set('aslang','ko');applyStatic();buildMarquee();updProfit();updOnline();switchTab('chat');loadChatHistory();}
    window.onload=function(){initApp();};
  </script>
