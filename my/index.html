<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>NexusAI 시그널</title>
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#080c18;--bg2:#0d1324;--bg3:#111827;
      --stroke:rgba(255,255,255,0.06);--stroke2:rgba(255,255,255,0.1);
      --text:#eef2ff;--muted:#7c85a3;--muted2:#4b5270;
      --gold:#facc15;--gold2:#eab308;--gold-glow:rgba(250,204,21,0.35);
      --green:#22c55e;--green-glow:rgba(34,197,94,0.3);
      --red:#ef4444;--blue:#3b82f6;
      --r1:24px;--r2:16px;--pill:999px;
      --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow-x:hidden;}
    body{
      font-family:'Outfit',system-ui,-apple-system,sans-serif;
      color:var(--text);
      background:var(--bg);
      -webkit-tap-highlight-color:transparent;
    }

    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px;}

    .app-wrap{
      max-width:480px;margin:0 auto;height:100%;overflow-y:auto;
      padding:calc(12px + var(--safeT)) 16px calc(120px + var(--safeB));
      position:relative;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
    }

    .top-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 0 12px;
    }
    .top-left{display:flex;align-items:center;gap:8px;}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:livePulse 2s infinite;}
    @keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green);}50%{opacity:.5;box-shadow:0 0 3px var(--green);}}
    .live-text{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;}
    .online-count{font-size:11px;color:var(--muted);font-weight:600;}
    .top-right{display:flex;align-items:center;gap:8px;}
    .tg-id{font-size:11px;font-weight:700;color:var(--blue);background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.15);padding:3px 10px;border-radius:var(--pill);}

    .lang-drop{position:relative;}
    .lang-btn{background:rgba(255,255,255,0.05);border:1px solid var(--stroke2);border-radius:10px;padding:4px 10px;color:var(--gold);font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;}
    .lang-btn::after{content:'▾';font-size:10px;color:var(--muted);}
    .lang-menu{position:absolute;top:110%;right:0;background:var(--bg3);border:1px solid var(--stroke2);border-radius:12px;padding:4px;z-index:500;display:none;min-width:80px;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
    .lang-menu.open{display:block;}
    .lang-opt{display:block;width:100%;padding:6px 12px;background:none;border:none;color:var(--muted);font-weight:700;font-size:12px;text-align:left;cursor:pointer;border-radius:8px;font-family:inherit;}
    .lang-opt:hover,.lang-opt.active{background:rgba(250,204,21,0.1);color:var(--gold);}

    .hero{
      text-align:center;padding:20px 0 16px;
      background:radial-gradient(ellipse at 50% 80%,rgba(34,197,94,0.08) 0%,transparent 60%);
    }
    .hero-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}
    .hero-amount{
      font-size:42px;font-weight:900;color:var(--green);
      text-shadow:0 0 30px var(--green-glow),0 0 60px rgba(34,197,94,0.15);
      transition:all 0.3s;position:relative;display:inline-block;
    }
    .hero-amount.bump{animation:profitBump 0.4s ease;}
    @keyframes profitBump{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
    .hero-sub{font-size:12px;color:var(--muted2);margin-top:2px;}
    .hero-float{
      position:absolute;top:-10px;right:-40px;
      font-size:14px;font-weight:800;color:var(--green);
      opacity:0;animation:floatUp 1s ease forwards;pointer-events:none;
    }
    @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}

    .meta-bar{
      display:flex;align-items:center;justify-content:center;gap:14px;
      padding:6px 0 4px;
    }
    .meta-pill{
      display:flex;align-items:center;gap:5px;
      padding:4px 10px;border-radius:var(--pill);
      background:rgba(255,255,255,0.04);border:1px solid var(--stroke);
      font-size:11px;font-weight:700;
    }
    .meta-pill .icon{font-size:13px;}
    .meta-pill .val{color:#fff;font-weight:800;}

    .vip-card{
      margin:0 16px 12px;padding:12px 16px;border-radius:14px;
      background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(255,215,0,0.02));
      border:1px solid rgba(255,215,0,0.2);position:relative;overflow:hidden;
    }
    .vip-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;
      background:radial-gradient(circle,rgba(255,215,0,0.15),transparent);border-radius:50%;}
    .vip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .vip-badge{display:flex;align-items:center;gap:8px;}
    .vip-badge-icon{font-size:28px;}
    .vip-badge-info{display:flex;flex-direction:column;}
    .vip-badge-tier{font-size:15px;font-weight:800;color:#fff;}
    .vip-badge-acc{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px;}
    .vip-next{text-align:right;}
    .vip-next-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .vip-next-tier{font-size:12px;font-weight:700;color:var(--gold);}
    .vip-progress{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);margin-top:4px;overflow:hidden;}
    .vip-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 0.6s ease;}
    .vip-progress-text{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--muted);font-weight:600;}

    .games-title{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

    .game-card{
      border-radius:var(--r2);padding:16px 14px;cursor:pointer;
      position:relative;overflow:hidden;min-height:110px;
      display:flex;flex-direction:column;justify-content:space-between;
      border:1px solid var(--stroke);
      backdrop-filter:blur(12px);
      transition:transform 0.15s,box-shadow 0.2s;
    }
    .game-card:active{transform:scale(0.97);}
    .game-card:hover{box-shadow:0 8px 30px rgba(0,0,0,0.4);}
    .game-card[data-game="aviator"]{background:linear-gradient(145deg,rgba(239,68,68,0.12),rgba(15,23,42,0.8));border-color:rgba(239,68,68,0.15);}
    .game-card[data-game="jetx"]{background:linear-gradient(145deg,rgba(245,158,11,0.12),rgba(15,23,42,0.8));border-color:rgba(245,158,11,0.15);}
    .game-card[data-game="mines"]{background:linear-gradient(145deg,rgba(59,130,246,0.12),rgba(15,23,42,0.8));border-color:rgba(59,130,246,0.15);}
    .game-card[data-game="penalty"]{background:linear-gradient(145deg,rgba(34,197,94,0.12),rgba(15,23,42,0.8));border-color:rgba(34,197,94,0.15);}
    .game-card[data-game="balloon"]{background:linear-gradient(145deg,rgba(168,85,247,0.12),rgba(15,23,42,0.8));border-color:rgba(168,85,247,0.15);}
    .game-card[data-game="chicken"]{background:linear-gradient(145deg,rgba(251,146,60,0.12),rgba(15,23,42,0.8));border-color:rgba(251,146,60,0.15);}

    .game-top{display:flex;align-items:center;gap:10px;}
    .game-icon{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--stroke2);flex-shrink:0;}
    .game-name{font-size:15px;font-weight:800;color:#fff;line-height:1.1;}
    .game-desc{font-size:10px;color:var(--muted2);font-weight:600;margin-top:2px;}
    .game-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .game-wr{
      display:flex;align-items:center;gap:4px;
      padding:3px 8px;border-radius:8px;
      background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.2);
    }
    .game-wr-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
    .game-wr-text{font-size:12px;font-weight:800;color:var(--green);}
    .game-play{font-size:11px;color:var(--muted2);font-weight:700;display:flex;align-items:center;gap:3px;}
    .game-play::after{content:'▶';font-size:8px;}

    .locked-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(8,12,24,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(6px);text-align:center;padding:10px;border-radius:var(--r2);}
    .lock-icon{font-size:28px;margin-bottom:6px;}
    .lock-text{color:var(--red);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px;}
    .lock-msg{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.3;}

    .panel{margin-top:12px;border-radius:var(--r2);border:1px solid var(--stroke);background:rgba(13,19,36,0.8);padding:16px;backdrop-filter:blur(8px);}
    .backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .back{border:1px solid var(--stroke);background:rgba(255,255,255,0.04);color:var(--muted);padding:8px 14px;border-radius:var(--pill);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
    .p-title{font-size:22px;font-weight:900;color:#fff;}
    .p-sub{margin-top:4px;color:var(--muted);font-size:13px;}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
    .btn{flex:1;min-width:140px;padding:14px;border-radius:14px;border:none;background:rgba(255,255,255,0.06);color:#fff;font-weight:800;cursor:pointer;font-size:14px;font-family:inherit;transition:transform .1s;}
    .btn:active{transform:scale(0.97);}
    .btn.primary{color:#0a0f1e;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 20px var(--gold-glow);}
    .btn[disabled]{opacity:0.4;cursor:not-allowed;background:#1e293b;color:var(--muted);box-shadow:none;}
    .stepbox{margin-top:14px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,0.02);padding:20px;text-align:center;}
    .stepnum{font-size:52px;font-weight:900;color:var(--gold);text-shadow:0 0 20px var(--gold-glow);}
    .steplabel{color:var(--muted2);font-weight:800;letter-spacing:1.5px;font-size:11px;text-transform:uppercase;margin-top:4px;}
    .stepnote{margin-top:10px;color:var(--muted);font-size:12px;}

    .sig-history{margin-top:14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,0.15);padding:10px 12px;}
    .sig-history-title{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .sig-history-row{display:flex;gap:4px;flex-wrap:wrap;}
    .sig-dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid var(--stroke);}
    .sig-dot.win{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.25);color:var(--green);}
    .sig-dot.lose{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.15);color:var(--red);}

    .cd-wrap{margin:12px auto;width:64px;height:64px;position:relative;}
    .cd-wrap svg{transform:rotate(-90deg);}
    .cd-wrap circle{fill:none;stroke-width:4;}
    .cd-wrap .bg{stroke:rgba(255,255,255,0.04);}
    .cd-wrap .prog{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
    .cd-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;font-weight:900;color:var(--gold);}

    .mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:280px;margin:16px auto;}
    .mines-cell{aspect-ratio:1;background:rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--stroke);}
    .mines-cell.active{background:var(--gold);box-shadow:0 0 12px var(--gold-glow);border-color:#fff;animation:popIn .3s ease;}
    .penalty-wrapper{width:100%;max-width:300px;height:180px;margin:16px auto;border:3px solid rgba(255,255,255,0.2);border-bottom:none;background:rgba(0,0,0,0.15);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);border-radius:8px 8px 0 0;}
    .penalty-cell{border:1px dashed rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;}
    .penalty-ball{font-size:22px;animation:popIn .3s cubic-bezier(.175,.885,.32,1.275);}
    @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    .tabs{margin-top:14px;}

    .daily-float{
      position:absolute;bottom:74px;right:16px;z-index:250;
      width:52px;height:52px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold),#f97316);
      box-shadow:0 4px 20px rgba(245,158,11,0.4);
      display:flex;align-items:center;justify-content:center;
      font-size:24px;cursor:pointer;
      animation:dailyBounce 3s ease-in-out infinite;
      border:2px solid rgba(255,255,255,0.2);
    }
    .daily-float.claimed{background:var(--bg3);box-shadow:none;animation:none;opacity:0.4;border-color:var(--stroke);}
    .daily-float-badge{
      position:absolute;top:-2px;right:-2px;
      width:16px;height:16px;border-radius:50%;
      background:var(--red);font-size:9px;font-weight:900;color:#fff;
      display:flex;align-items:center;justify-content:center;
    }
    .daily-float.claimed .daily-float-badge{display:none;}
    @keyframes dailyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

    .daily-popup{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.7);z-index:600;display:none;
      align-items:center;justify-content:center;
      backdrop-filter:blur(4px);
    }
    .daily-popup.open{display:flex;}
    .daily-card{
      background:var(--bg3);border:1px solid var(--stroke2);border-radius:20px;
      padding:28px 24px;text-align:center;max-width:300px;width:90%;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .daily-card-icon{font-size:48px;margin-bottom:8px;}
    .daily-card-title{font-size:20px;font-weight:900;color:#fff;}
    .daily-card-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4;}
    .daily-card-btn{
      margin-top:16px;width:100%;padding:14px;border:none;border-radius:14px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#0a0f1e;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
      box-shadow:0 6px 20px var(--gold-glow);
    }
    .daily-card-timer{margin-top:12px;font-size:13px;color:var(--muted);font-weight:600;}

    .confetti-box{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9000;overflow:hidden;}
    .confetti-p{position:absolute;top:-10px;animation:cFall 3s ease-in forwards;}
    @keyframes cFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

    .marquee-wrap{position:absolute;left:0;right:0;bottom:0;width:100%;background:var(--bg);border-top:1px solid rgba(250,204,21,0.15);padding:7px 0;z-index:200;overflow:hidden;white-space:nowrap;}
    .marquee-inner{display:inline-block;animation:mqScroll 120s linear infinite;font-size:11px;font-weight:600;color:var(--muted);will-change:transform;}
    .marquee-inner span{color:var(--gold);font-weight:800;}
    @keyframes mqScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    #splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 1s ease;}
    .splash-text{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;color:#fff;opacity:0;animation:fadeUp 2.5s ease forwards;}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(20px)}40%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

    #tutOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5000;pointer-events:none;opacity:0;transition:opacity .5s;display:none;}
    .focus-box{position:absolute;border-radius:16px;box-shadow:0 0 0 4000px rgba(0,0,0,0.88);transition:all .6s cubic-bezier(.25,1,.5,1);border:2px solid rgba(255,255,255,0.4);pointer-events:none;}
    .tut-card{position:absolute;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);padding:16px;border-radius:16px;color:#fff;font-size:14px;line-height:1.4;max-width:280px;text-align:center;opacity:0;transition:opacity .4s .2s;z-index:5002;}
    .skip-btn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:8px 16px;border-radius:99px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;z-index:5003;pointer-events:auto;font-family:inherit;}

    .reg-btn{margin-top:8px;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0f1e;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
    .promo-text{margin-top:6px;font-size:13px;color:var(--gold);font-weight:900;letter-spacing:1px;background:rgba(250,204,21,0.12);border:1px dashed rgba(250,204,21,0.4);padding:4px 12px;border-radius:8px;display:inline-block;cursor:pointer;}

    .app-shell{position:fixed;inset:0;max-width:480px;width:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;height:100dvh;}
    .app-body{flex:1;min-height:0;position:relative;overflow:hidden;}
    .tab-bar{position:relative;left:auto;right:auto;bottom:auto;width:100%;height:56px;background:#060a14;border-top:1px solid rgba(250,204,21,0.15);display:flex;align-items:center;justify-content:center;z-index:300;box-shadow:0 -8px 30px rgba(0,0,0,0.5);flex-shrink:0;}
    .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted2);transition:all .2s;border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;}
    .tab-item.active{color:var(--gold);}
    .tab-item .tab-icon{font-size:20px;line-height:1;}
    .tab-item .tab-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
    .tab-content{display:none;height:100%;}
    .tab-content.active{display:block;}

    #tabChat{height:100%;background:var(--bg);display:none;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden;position:relative;}
    #tabChat.active{display:grid !important;}
    .chat-header{padding:calc(8px + var(--safeT)) 16px 4px;flex-shrink:0;background:var(--bg);}
    .chat-box{min-height:0;height:100%;overflow:hidden;display:flex;flex-direction:column;padding:0 16px 0;}
    .chat-msgs{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;min-height:0;max-height:100%;overscroll-behavior:contain;}
    .msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-wrap:break-word;animation:msgIn .3s ease;}
    @keyframes msgIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
    .msg.bot{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid var(--stroke);color:var(--text);border-bottom-left-radius:4px;}
    .msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0f1e;font-weight:600;border-bottom-right-radius:4px;}
    .msg.typing{align-self:flex-start;background:rgba(255,255,255,0.04);border:1px solid var(--stroke);color:var(--muted);font-style:italic;}
    .msg-time{font-size:9px;color:var(--muted2);margin-top:3px;}
    .chat-input-row{display:flex;gap:8px;padding:8px 16px 8px;border-top:1px solid var(--stroke);align-items:flex-end;flex-shrink:0;background:var(--bg);}

      nxB.onclick=()=>{if(isSignalLimitReached()){const tier=getVipTier();const idx=getVipTierIdx();let uh='';if(idx<VIP_TIERS.length-1){const next=VIP_TIERS[idx+1];const need=next.dep-parseInt(S.get('totalDep')||'0');uh=`<div style="margin-top:14px;padding:10px;background:rgba(255,215,0,0.08);border-radius:10px;border:1px solid rgba(255,215,0,0.2)"><div style="font-size:13px;font-weight:700;color:#fff">${next.icon} ${tierName(next)} — ${next.sigs||'∞'} ${lang==='ko'?'시그널/일':'signals/day'}, ${next.acc}%</div><div style="font-size:11px;color:var(--gold);margin-top:4px">${lang==='ko'?'채팅에서 RM '+need.toLocaleString()+' 충전 ⬆':'Top up RM '+need.toLocaleString()+' in chat ⬆'}</div></div>`;}document.querySelector('.stepbox').innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:36px">⚡</div><div style="font-size:15px;font-weight:800;color:#fff;margin-top:8px">${lang==='ko'?'AI 서버 한도 도달':'AI Server limit reached'}</div><div style="font-size:12px;color:var(--muted);margin-top:6px">${tier.icon} ${tierName(tier)} — ${tier.sigs} ${lang==='ko'?'시그널/일':'signals/day'}</div><div style="font-size:13px;color:var(--muted);margin-top:8px">${lang==='ko'?'더 높은 입금 = 더 많은 서버 리소스':'Higher deposit = more server resources'}</div>${uh}</div>`;nxB.disabled=true;nxB.textContent=limitTxt;return;}nxB.disabled=true;sN.textContent='...';try{navigator.vibrate&&navigator.vibrate(50);}catch(e){}setTimeout(()=>{addDailySignal();sN.textContent=`${lang==='ko'?'단계':'Step'} ${rndInt(1,6)}`;nxB.disabled=false;playSfx();addProfit(rndInt(2000,10000));const ts=parseInt(S.get('tsig')||'0')+1;S.set('tsig',ts.toString());addSigHist('chicken');if(isSignalLimitReached()){nxB.disabled=true;nxB.textContent=limitTxt;}},500);};dT();
    }

    // CHAT
    let chatH=[],chatLD=false,chatSnd=false,chatImgB64=null;
    function handleChatImage(input){
      const file=input.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=function(e){
        const img=new Image();img.onload=function(){const MAX=800;let w=img.width,h=img.height;if(w>MAX){h=h*(MAX/w);w=MAX;}if(h>MAX){w=w*(MAX/h);h=MAX;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);chatImgB64=c.toDataURL('image/jpeg',0.6);
        const prev=document.getElementById('chatImgPreview');
        prev.style.display='block';
        prev.innerHTML=`<div class="chat-img-preview"><img src="${chatImgB64}"><button class="chat-img-remove" onclick="removeChatImage()">✕</button></div>`;
      };img.src=e.target.result;};
      reader.readAsDataURL(file);
      input.value='';
    }
    function removeChatImage(){chatImgB64=null;document.getElementById('chatImgPreview').style.display='none';document.getElementById('chatImgPreview').innerHTML='';}
    function scrollChatBottom(){const e=document.getElementById('chatMessages');if(e)e.scrollTop=e.scrollHeight;}
    function linkify(text){return text.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:#4fc3f7;text-decoration:underline;word-break:break-all">$1</a>').replace(/\b(777[A-Z]{2}777)\b/g,'<span onclick="navigator.clipboard.writeText(\'$1\');this.style.background=\'#4fc3f7\';this.textContent=\'복사됨!\';setTimeout(()=>{this.textContent=\'$1\';this.style.background=\'rgba(79,195,247,0.15)\'},1200)" style="background:rgba(79,195,247,0.15);color:#4fc3f7;padding:2px 8px;border-radius:6px;font-weight:700;font-family:monospace;cursor:pointer;display:inline-block;border:1px dashed rgba(79,195,247,0.4)">$1</span>');}
    function chatVipBanner(){const tier=getVipTier();const idx=getVipTierIdx();const dep=parseInt(S.get('totalDep')||'0');let hint='';if(idx<VIP_TIERS.length-1){const next=VIP_TIERS[idx+1];const remain=next.dep-dep;hint=`<div style="font-size:10px;color:var(--muted);margin-top:2px">RM ${remain.toLocaleString()} → ${next.icon} ${tierName(next)} (${next.acc}%)</div>`;}return `<div style="text-align:center;padding:8px;margin-bottom:4px;background:rgba(255,215,0,0.06);border-radius:10px;border:1px solid rgba(255,215,0,0.15)"><span style="font-size:18px">${tier.icon}</span> <span style="font-size:13px;font-weight:800;color:#fff">${tierName(tier)}</span> <span style="font-size:11px;color:var(--gold);font-weight:700">${tier.acc}% ${lang==='ko'?'정확도':'accuracy'}</span>${hint}</div>`;}
    function renderChat(){const e=document.getElementById('chatMessages');if(!chatH.length){e.innerHTML=`<div class="chat-welcome"><div class="chat-welcome-icon">🔒</div><div class="chat-welcome-title">${lang==='ko'?'AI 시그널을 잠금 해제하시겠습니까?':'Want to unlock AI Signals?'}</div><div class="chat-welcome-text">${lang==='ko'?'아래에 메시지를 보내주세요 👇':'Type a message below 👇'}</div></div>`;return;}e.innerHTML=chatVipBanner();chatH.forEach(m=>{const d=document.createElement('div');d.className=`msg ${m.r==='user'?'user':'bot'}`;const hasHtml=m.t.includes('<img');if(hasHtml){d.innerHTML=m.t+(m.tm?`<div class="msg-time">${m.tm}</div>`:'');}else if(m.r==='bot'){d.innerHTML=linkify(m.t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))+(m.tm?`<div class="msg-time">${m.tm}</div>`:'');}else{d.textContent=m.t;if(m.tm){const tm=document.createElement('div');tm.className='msg-time';tm.textContent=m.tm;d.appendChild(tm);}}e.appendChild(d);});scrollChatBottom();}
    async function loadChatHistory(){if(chatLD||!tgUserId)return;try{const r=await fetch(CHAT_HISTORY_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:tgUserId,first_name:userName||"User",geo:'kr'})});if(!r.ok)throw new Error('history_http_'+r.status);const d=await r.json();if(d.messages&&d.messages.length){chatH=d.messages.map(m=>({r:m.role,t:m.text,tm:m.time||''}));renderChat();}chatLD=true;}catch(e){chatLD=true;}}
    let _lastSendTs=0,_lastSendTxt='',_sendLock=false;
    async function sendChatMessage(){if(_sendLock)return;const now=Date.now();const inp=document.getElementById('chatInput'),txt=inp.value.trim();if(!txt&&!chatImgB64)return;if(txt===_lastSendTxt&&now-_lastSendTs<5000)return;_sendLock=true;_lastSendTs=now;_lastSendTxt=txt;chatSnd=true;document.getElementById('chatSendBtn').disabled=true;
    const displayMsg=chatImgB64?`${txt?txt+'<br>':''}<img src="${chatImgB64}">`:(txt);
    chatH.push({r:'user',t:displayMsg,tm:hhmm(new Date())});
    const imgData=chatImgB64;
    inp.value='';inp.style.height='auto';removeChatImage();renderChat();
    const el=document.getElementById('chatMessages'),tp=document.createElement('div');tp.className='msg typing';tp.id='tpI';tp.textContent=lang==='ko'?'입력 중...':'Typing...';el.appendChild(tp);scrollChatBottom();
    try{const urlFbclid=new URLSearchParams(window.location.search).get('fbclid')||'';const vt=getVipTier();const body={user_id:tgUserId,first_name:userName||"User",message:txt||'[photo]',geo:'kr',lang:lang,source:'miniapp',fbp:getFbParam('_fbp'),fbc:getFbParam('_fbc'),fbclid:urlFbclid,vip_tier:vt.name,vip_accuracy:vt.acc,total_deposit:parseInt(S.get('totalDep')||'0'),streak:parseInt(S.get('scnt')||'0')};if(imgData)body.image=imgData;
    const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),25000);const r=await fetch(CHAT_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});clearTimeout(timeout);if(!r.ok)throw new Error('chat_http_'+r.status);const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{};}catch(e){d={reply:raw};}const botText=d.reply||d.message||d.output||(lang==='ko'?'오류가 발생했습니다. 다시 보내주세요 🙏':'Something went wrong, try again 🙏');if(d.total_deposit&&d.total_deposit>0){S.set('totalDep',String(d.total_deposit));updVIP();}if(d.access_granted){S.set('accessGranted','1');}const typingDelay=Math.min(Math.max(botText.length*25,800),3000)+Math.random()*800;await new Promise(r=>setTimeout(r,typingDelay));document.getElementById('tpI')?.remove();chatH.push({r:'bot',t:botText,tm:hhmm(new Date())});}catch(e){await new Promise(r=>setTimeout(r,1000));document.getElementById('tpI')?.remove();chatH.push({r:'bot',t:lang==='ko'?'네트워크 오류, 다시 보내주세요 🔄':'Network error, try again 🔄',tm:hhmm(new Date())});}
    renderChat();chatSnd=false;_sendLock=false;document.getElementById('chatSendBtn').disabled=false;}
    document.getElementById('chatInput').addEventListener('input',function(){this.style.height='42px';scrollChatBottom();});
    document.getElementById('chatInput').addEventListener('focus',function(){document.getElementById('tabChat').style.height='100%';setTimeout(scrollChatBottom,120);});
    document.getElementById('chatInput').addEventListener('blur',function(){setTimeout(scrollChatBottom,60);});
    document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage();}});

    // TOP PLAYERS — weekly seed, $ currency
    function sRnd(s){let x=Math.sin(s)*10000;return x-Math.floor(x);}
    function getWeekSeed(){const d=new Date(),y=d.getFullYear(),jan1=new Date(y,0,1),days=Math.floor((d-jan1)/864e5),week=Math.ceil((days+jan1.getDay()+1)/7);return y*100+week;}
    function genTop(){
      const ws=getWeekSeed();
      const baseNames=[...new Set(REAL_NAME_POOL.map(x=>String(x).trim()).filter(Boolean))];
      while(baseNames.length<100){baseNames.push(`Player${baseNames.length+1}`);}
      const gn=["Aviator","JetX","Mines","Chicken","Balloon","Penalty"];
      const ordered=baseNames.slice(0,100);
      const p=[];
      let prevAmt=12000;
      for(let i=0;i<100;i++){
        const r2=sRnd(ws+i*17+7),r3=sRnd(ws+i*23+11),r4=sRnd(ws+i*31+3);
        const nm=ordered[i];
        const gm=gn[Math.floor(r2*gn.length)];
        const ratio=i/99;
        const base=11500*Math.pow(1-ratio*0.97,1.8)+200;
        const jitter=1+(r3-0.5)*0.30;
        let am=Math.round(base*jitter);
        am=Math.min(am,prevAmt-Math.floor(r4*40+5));
        am=Math.max(am,180+Math.floor(r4*60));
        if(i>=90)am=Math.max(am,180+Math.floor(r3*100));
        if(i===99)am=Math.min(am,280);
        prevAmt=am;
        p.push({rk:i+1,nm,gm,am});
      }
      return p;
    }
    function renderTopPlayers(){const d=new Date(),ds=d.toLocaleDateString('ko-KR',{month:'short',day:'numeric',year:'numeric'});document.getElementById('topDate').textContent=`📅 ${ds} 주간`;const p=genTop(),pd=document.getElementById('topPodium'),md=['🥈','🥇','🥉'],od=[1,0,2];pd.innerHTML=od.map(i=>`<div class="podium-item"><div class="podium-avatar">${md[i]}</div><div class="podium-name">${p[i].nm}</div><div class="podium-amount">$${p[i].am.toLocaleString()}</div></div>`).join('');document.getElementById('topList').innerHTML=p.map(x=>`<div class="top-row"><div class="top-rank">${x.rk<=3?['🥇','🥈','🥉'][x.rk-1]:'#'+x.rk}</div><div class="top-name">${x.nm}</div><div class="top-game">${x.gm}</div><div class="top-amount">+$${x.am.toLocaleString()}</div></div>`).join('');}

    // TUTORIAL
    const splash=document.getElementById("splash"),sName=document.getElementById("splashName"),overlay=document.getElementById("tutOverlay"),focusBox=document.getElementById("focusBox"),tutText=document.getElementById("tutText");let isSkipped=false;
    function setFocus(el,text){if(!el)return;const r=el.getBoundingClientRect();focusBox.style.width=(r.width+12)+"px";focusBox.style.height=(r.height+12)+"px";focusBox.style.top=(r.top-6)+"px";focusBox.style.left=(r.left-6)+"px";tutText.style.opacity="0";setTimeout(()=>{if(isSkipped)return;tutText.textContent=text;let tp=r.bottom+20;if(tp>window.innerHeight-100)tp=r.top-100;tutText.style.top=tp+"px";tutText.style.left="50%";tutText.style.transform="translateX(-50%)";tutText.style.opacity="1";},300);}
    async function startTutorial(force=false){if(S.get("st7")&&!force)return;isSkipped=false;switchTab('signals');renderHome();overlay.style.display="block";setTimeout(()=>overlay.style.opacity="1",10);if(isSkipped)return;setFocus(document.getElementById("userHeaderId"),T().tut.s1);await wait(5000);if(isSkipped)return;setFocus(document.getElementById("gamesGrid"),T().tut.s2);await wait(5000);if(isSkipped)return;tutText.style.opacity="0";renderGame('aviator');document.getElementById("cD").textContent="2.45x";await wait(2000);if(isSkipped)return;const c=document.getElementById("cD");if(c)setFocus(c.parentElement,T().tut.s4);await wait(5000);if(isSkipped)return;setFocus(document.getElementById("sBtn"),T().tut.s5);await wait(5000);endTutorial();}
    function skipTutorial(){isSkipped=true;endTutorial();}
    function endTutorial(){overlay.style.opacity="0";setTimeout(()=>{overlay.style.display="none";S.set("st7","1");renderHome();},500);}

      streak:{title:'🔥 일일 연속',text:lang==='ko'?'매일 앱을 열어 연속 기록을 쌓으세요. 길수록 VIP 레벨이 올라갑니다!':'Open the app daily to build your streak. Longer streak = better VIP level!'},
      vip:{title:'🏅 VIP 등급',text:'AI 서버는 실제 비용이 듭니다.\n입금액이 계정 리소스를 결정합니다.\n\n🥉 브론즈 (RM 80,000) — 3 시그널/일, 85%\n\n🥈 실버 (RM 90,000) — 5 시그널/일, 89%\n\n🥇 골드 (RM 105,000) — 10 시그널/일, 93%\n\n💎 다이아몬드 (RM 120,000) — 무제한, 96%\n\n👑 플래티넘 (RM 135,000) — 98% + Zach 개인 알림\n\n더 높은 입금 → 더 많은 리소스 → 더 많은 시그널 → 더 큰 수익 🤝'},
      profit:{title:'💰 오늘의 수익',text:lang==='ko'?'오늘 따라한 시그널의 총 수익입니다. 매일 자정에 초기화됩니다.':'Total profit from signals followed today. Resets at midnight.'},
      bonus:{title:'🎁 일일 보너스',text:lang==='ko'?'24시간마다 한 번 받을 수 있습니다. 무료 VIP 시그널을 제공합니다.':'Claim once every 24 hours for a free VIP signal.'},
      winrate:{title:'📊 승률',text:lang==='ko'?'이 게임의 AI 예측 역사적 정확도입니다.':'Historical accuracy of AI predictions for this game.'}
    };
    function showHelp(key){
      const d=HELP_DATA[key];if(!d)return;
      const ov=document.createElement('div');ov.className='help-overlay';

      ov.onclick=close;tt.onclick=close;
    }

    // APP INIT
    function initApp(){
      try{window.trackKrEvent&&window.trackKrEvent('MiniAppOpen',{geo:'KR',lang:'ko'});}catch(e){}
      lang='ko';S.set('aslang','ko');
      applyStatic();buildMarquee();updProfit();updOnline();updVIP();
      switchTab('chat');

    // INIT
    let _appBooted=false;
    function bootApp(){
      if(_appBooted)return;_appBooted=true;
      try{splash.style.opacity="0";}catch(e){}
      setTimeout(()=>{
        try{splash.style.display="none";}catch(e){}
        initApp();
        setTimeout(()=>startTutorial(),500);
      },800);
    }
    window.onload=function(){
      sName.textContent=userName!=='Guest'?`안녕하세요, ${userName}`:'';
      setTimeout(bootApp,2500);
    };
    // fallback: if onload never fires (Telegram WebView), boot after 5s
    setTimeout(()=>{
      if(!_appBooted){
        try{sName.textContent=userName!=='Guest'?`안녕하세요, ${userName}`:'';}catch(e){}
        bootApp();
      }
    },5000);
    document.addEventListener('DOMContentLoaded',()=>{ setTimeout(()=>{ if(!_appBooted) bootApp(); },4000); });
