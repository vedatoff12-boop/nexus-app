  async function refreshAccessState(){
    const uid=String(tgUserId||'');

    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),10000);
    try{
      const res=await fetch(CONFIG.accessUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,geo:CONFIG.geo,start_param:String(getStartParam()||''),app_ns:APP_NS}),signal:controller.signal});

  function predictionShell(m,body){return `<button class="back" onclick="showMatches()">← O'yinlar</button><div class="premium-card"><div class="match-top"><div class="match-date">${fmtLocal(m.utc)}</div><div class="group-pill">Guruh ${escapeHtml(m.group)}</div></div><div class="teams" style="margin:10px 0 8px"><div class="team"><div class="flag">${flagFor(m.home)}</div><div class="name">${escapeHtml(teamName(m.home))}</div></div><div class="vs">VS</div><div class="team away"><div class="name">${escapeHtml(teamName(m.away))}</div><div class="flag">${flagFor(m.away)}</div></div></div><div class="venue">📍 ${escapeHtml(m.stadium)} · ${escapeHtml(m.city)}</div>${body}</div>`}
  function predictionHero(m,p){return `<div class="prediction-hero"><div class="prediction-teams"><div class="hero-flag">${flagFor(m.home)}</div><div class="hero-vs">VS</div><div class="hero-flag">${flagFor(m.away)}</div></div><div class="prediction-head"><div class="prediction-label">Asosiy bashorat</div><div class="main-pick">${escapeHtml(p.main||`${teamName(m.home)} vs ${teamName(m.away)}`)}</div><div class="main-comment">${escapeHtml(p.teaser||"Ko'rib chiqish yuklanmoqda.")}</div></div></div>`}
  function loadingPrediction(m){return predictionShell(m,`${predictionHero(m,{main:'Bashorat yuklanmoqda...',teaser:'NexusAI jonli AI kartani yuklamoqda.'})}<div class="soon-card"><div class="soon-icon">⏳</div><div class="soon-title">Bashorat yuklanmoqda...</div><div class="soon-copy">NexusAI premium kartani jonli yuklamoqda.</div></div>`)}
  function errorPrediction(m,msg){return predictionShell(m,`${predictionHero(m,{main:'Bashorat mavjud emas',teaser:"Jonli bashoratni yuklab bo'lmadi. Qayta urinib ko'ring."})}<div class="soon-card"><div class="soon-icon">⚠️</div><div class="soon-title">Bashoratni yuklab bo'lmadi</div><div class="soon-copy">${escapeHtml(msg||"Tarmoq xatosi. Qayta urinib ko'ring.")}</div><button class="reg-btn" style="margin-top:13px" onclick="openPrediction('${escapeHtml(m.id)}')">Qayta urinish</button></div>`)}
  async function openPrediction(id){
    const m=PARTIDOS.find(x=>String(x.id)===String(id));
    const el=document.getElementById('matchesScreen');
    if(!m){currentPredictionId=null;el.innerHTML=`<button class="back" onclick="showMatches()">← O'yinlar</button><div class="soon-card"><div class="soon-icon">⚠️</div><div class="soon-title">O'yin topilmadi</div><div class="soon-copy">Bu o'yin mahalliy taqvimda mavjud emas.</div></div>`;return;}
    currentPredictionId=String(id);
    el.innerHTML=loadingPrediction(m);
    el.scrollTop=0;
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    try{
      const res=await fetch(CONFIG.predictionUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({match_id:String(id), user_id:String(tgUserId)}),signal:controller.signal});
      clearTimeout(timeout);
      let data={};
      try{data=await res.json()}catch(e){throw new Error('bad_json')}
      if(!res.ok||data.ok!==true){throw new Error(data.error||`http_${res.status}`)}
      const p={main:data.main||'',teaser:data.teaser||'',markets:Array.isArray(data.markets)?data.markets:[],blocks:Array.isArray(data.blocks)?data.blocks:[],unlocked:(data.unlocked===true||accessGranted)};
      const body=predictionHero(m,p)+(p.unlocked?fullPrediction(p):lockedPrediction(p));
      el.innerHTML=predictionShell(m,body);
      el.scrollTop=0;
    }catch(e){
      clearTimeout(timeout);
      const msg=e&&e.name==='AbortError'?"So'rov juda uzoq davom etdi. Qayta urinib ko'ring.":"Jonli bashoratda xatolik. Qayta urinib ko'ring.";
      el.innerHTML=errorPrediction(m,msg);
      el.scrollTop=0;
    }
  }
  function marketTile(x,i){const market=x.market||'';const meta=MARKET_META[market]||{label:market||'Bozor',icon:'✦'};const label=x.label||meta.label||market||'Bozor';return `<div class="market ${i<4?'primary':''}"><div class="market-icon">${meta.icon}</div><div class="market-title">${escapeHtml(label)}</div><div class="market-pick">${escapeHtml(x.pick||'—')}</div><div class="market-note">${escapeHtml(x.note||'')}</div></div>`}
  function fullPrediction(p){const cleanMarkets=(p.markets||[]).filter(x=>x&&x.pick);const blocks=(p.blocks||[]).filter(b=>b&&b.title&&Array.isArray(b.items));return `<div class="markets-grid">${cleanMarkets.map(marketTile).join('')}</div><div style="margin-top:14px">${blocks.map(b=>`<details><summary>${escapeHtml(b.title)}</summary><div class="detail-body"><ul>${b.items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul></div></details>`).join('')}</div>`}
  function lockedPrediction(p){return `<div class="locked-wrap"><div class="lock-icon">🔒</div><div class="lock-title">Premium tahlil yopiq</div><div class="lock-copy">${escapeHtml(p.teaser||'Bepul ko\'rib chiqishingiz mumkin. To\'liq bozorlar va tahlil botda kirish orqali ochiladi.')}</div><button class="reg-btn" onclick="switchTab('chat')">💬 Botdan kirish oling</button></div>`}

  function fmtVenueLocal(iso,stadium){return new Intl.DateTimeFormat(appLocale(),{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short',timeZone:appTimeZone()}).format(new Date(iso))}
  function fmtNum(n){return new Intl.NumberFormat(appLocale()).format(n)}
  function shortTeam(name){return name==='Bosnia and Herzegovina'?'Bosnia & Herz.':teamName(name)}
  function stadiumCard(s){const cap=s.wc2026_planned_capacity?`${fmtNum(s.capacity)} · WC plan ${fmtNum(s.wc2026_planned_capacity)}`:fmtNum(s.capacity);return `<article class="stadium-card"><div class="stadium-photo"><img src="${s.photo}" alt="${escapeHtml(s.real_name)}" loading="lazy" decoding="async"><div class="stadium-tag">${countryName(s.country)}</div></div><div class="stadium-body"><div class="stadium-fifa">${escapeHtml(s.fifa_name)}</div><div class="stadium-real">${escapeHtml(s.real_name)}</div><div class="stadium-meta"><span class="meta-pill">📍 ${escapeHtml(s.city)}, ${escapeHtml(countryName(s.country))}</span><span class="meta-pill">👥 ${cap}</span><span class="meta-pill">Ochilgan ${escapeHtml(s.opened||'—')}</span></div><div class="known-for">${escapeHtml(s.known_for||'')}</div><div class="stadium-partidos">${s.partidos.map(x=>`<div class="mini-match"><div class="mini-match-num">M${x.n} · Guruh ${escapeHtml(String(x.group||'').replace('Grupo ',''))}</div><div class="mini-match-teams">${escapeHtml(shortTeam(x.home))} vs ${escapeHtml(shortTeam(x.away))}</div><div class="mini-match-date">${fmtVenueLocal(x.utc,s.fifa_name)}</div></div>`).join('')}</div><div class="photo-credit">Surat: ${escapeHtml(s.photo_credit||'Wikimedia Commons')} · ${escapeHtml(s.photo_license||'')}</div></div></article>`}
  function groupCard(g){return `<div class="group-card"><div class="group-head"><div class="group-name">Guruh ${g.group}</div><div class="group-note">Turnirgacha</div></div><table class="standings"><thead><tr><th style="text-align:left">Jamoa</th><th>O'</th><th>G'</th><th>D</th><th>M</th><th>Och</th></tr></thead><tbody>${g.teams.map(t=>`<tr><td class="team-cell"><span class="small-flag">${flagFor(t.name)}</span><span>${escapeHtml(teamName(t.name))}</span></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`).join('')}</tbody></table></div>`}
  function dossierBlock(){return ''}
  function infoMatchCard(m){const s=STADIUM_BY_NAME[m.stadium]||{};const isCVQ=false;return `<article class="info-match-card"><div class="info-match-photo"><img src="${s.photo||''}" alt="${escapeHtml(m.stadium)}" loading="lazy" decoding="async"><div class="info-match-over"><div><div class="info-match-num">O'yin ${m.n} · Guruh ${m.group}</div></div><div class="info-match-place">${escapeHtml(m.stadium)}<br>${escapeHtml(m.city)}</div></div></div><div class="info-match-body"><div class="info-teams"><div class="info-team"><div class="flag">${flagFor(m.home)}</div><div class="info-team-name">${escapeHtml(teamName(m.home))}</div></div><div class="vs">VS</div><div class="info-team away"><div class="info-team-name">${escapeHtml(teamName(m.away))}</div><div class="flag">${flagFor(m.away)}</div></div></div><div class="info-date">🕒 Toshkent vaqti: ${fmtVenueLocal(m.utc,m.stadium)} · 📍 ${escapeHtml(s.real_name||m.stadium)}, ${escapeHtml(s.city||m.city)}</div>${isCVQ?dossierBlock():`<div class="coming-details">Jamoa ma'lumotlari tez orada.</div>`}</div></article>`}
  let infoActiveTab='partidos';
  let infoActiveGroup='K';
  const GROUP_ORDER='ABCDEFGHIJKL'.split('');
  function switchInfoTab(tab){infoActiveTab=tab;document.querySelectorAll('.info-tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderInfoPanel()}
  function selectInfoGroup(group){infoActiveGroup=group;renderInfoPanel()}
  function infoTabButton(tab,label){return `<button class="info-tab-btn ${infoActiveTab===tab?'active':''}" data-tab="${tab}" onclick="switchInfoTab('${tab}')">${label}</button>`}
  function groupChip(group){return `<button class="group-chip-btn ${infoActiveGroup===group?'active':''}" onclick="selectInfoGroup('${group}')">${group}</button>`}
  function renderInfoPanel(){const panel=document.getElementById('infoPanel');if(!panel)return;const header={stadiums:{k:'STADIONLAR',t:'16 maydon',s:"Haqiqiy suratlar, maydon ma'lumotlari va Jahon chempionati 2026 o'yinlari.",c:`${INFO_ESTADIOS.length} maydon`},groups:{k:'GURUHLAR',t:'12 guruh',s:"Turnirgacha jadval. O'/G'/D/M/Och noldan boshlanadi.",c:'A–L'},partidos:{k:"O'YINLAR",t:`${infoActiveGroup} guruh o'yinlari`,s:"Guruhni tanlang. Pastda faqat tanlangan guruh ko'rinadi.",c:'6 karta'}}[infoActiveTab];let body='';if(infoActiveTab==='stadiums'){body=`<div class="stadium-grid">${INFO_ESTADIOS.map(stadiumCard).join('')}</div>`}else if(infoActiveTab==='groups'){body=`<div class="groups-grid">${GROUP_ORDER.map(g=>INFO_GRUPOS.find(x=>x.group===g)).filter(Boolean).map(groupCard).join('')}</div>`}else{const rows=INFO_PARTIDOS.filter(m=>m.group===infoActiveGroup).sort((a,b)=>a.n-b.n);body=`<div class="group-chip-row">${GROUP_ORDER.map(groupChip).join('')}</div><div class="match-info-list">${rows.map(infoMatchCard).join('')}</div>`}panel.innerHTML=`<section class="info-section"><div class="info-section-head"><div><div class="info-kicker">${header.k}</div><div class="info-title">${header.t}</div><div class="info-sub">${header.s}</div></div><div class="chip">${header.c}</div></div>${body}</section>`;const activeChip=panel.querySelector('.group-chip-btn.active');if(activeChip)activeChip.scrollIntoView({block:'nearest',inline:'center'});}
  function renderInfo(){const el=document.getElementById('infoScreen');if(!el)return;el.innerHTML=`<div class="top-bar"><div class="top-left"><div class="live-dot"></div><span class="live-text">Faqat ma'lumot</span></div><div class="tg-id">${flagFor(CONFIG.country)} WC2026</div></div><div class="hero"><div class="kicker">NexusAI Jahon chempionati</div><div class="hero-title">Ma'lumot markazi</div><div class="hero-sub">Turnir bo'yicha xolis ma'lumotlar — premium bo'limlarda.</div></div><div class="info-tabs">${infoTabButton('stadiums','🏟️ Stadionlar')}${infoTabButton('groups','📊 Guruhlar')}${infoTabButton('partidos',"⚽ O'yinlar")}</div><div id="infoPanel" class="info-panel"></div><div class="info-source">Manba: NexusAI tahlil markazi.</div>`;renderInfoPanel();}
  let chatH=[],chatLD=false,chatLock=false;
  function hhmm(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
  function renderChat(){const wrap=document.getElementById('chatMessages'); if(!wrap)return; if(!chatH.length){wrap.innerHTML=`<div class="chat-welcome"><div class="chat-welcome-icon">💬</div><div class="chat-welcome-title">Jahon chempionati bashoratlariga kirish kerakmi?</div><div class="chat-welcome-text">Bu yerga yozing — NexusAI ro'yxatdan o'tish va kirishda yordam beradi 👇</div></div>`;return;} wrap.innerHTML=''; chatH.forEach(m=>addMsg(m.text,m.role,false,m.time)); wrap.scrollTop=wrap.scrollHeight;}
  function addMsg(text,who='bot',save=true,time){const wrap=document.getElementById('chatMessages'); const welcome=wrap.querySelector('.chat-welcome'); if(welcome) welcome.remove(); const d=document.createElement('div'); d.className='msg '+who; const body=document.createElement('div'); body.innerHTML=escapeHtml(String(text||'')).split('\n').join('<br>'); d.appendChild(body); const tm=document.createElement('div'); tm.className='msg-time'; tm.textContent=time||hhmm(new Date()); d.appendChild(tm); wrap.appendChild(d); wrap.scrollTop=wrap.scrollHeight; if(save){chatH.push({role:who,text:String(text||''),time:tm.textContent}); try{localStorage.setItem(APP_NS+':chat',JSON.stringify(chatH.slice(-40)))}catch(e){}} }
  async function loadChatHistory(){if(chatLD)return; chatLD=true; try{const cached=localStorage.getItem(APP_NS+':chat'); if(cached){const arr=JSON.parse(cached); if(Array.isArray(arr)&&arr.length){chatH=arr; renderChat();}}}catch(e){} const uid=String(tgUserId||''); if(!uid||uid==='preview'){renderChat();return;} const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),10000); try{const r=await fetch(CONFIG.chatHistoryUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,geo:CONFIG.geo,lang:CONFIG.lang,source:'miniapp'}),signal:controller.signal}); clearTimeout(timeout); if(!r.ok)throw new Error('history_http_'+r.status); const d=await r.json(); if(Array.isArray(d.messages)){chatH=d.messages.map(m=>({role:m.role==='user'?'user':'bot',text:m.content||m.text||'',time:m.time||''})); try{localStorage.setItem(APP_NS+':chat',JSON.stringify(chatH.slice(-40)))}catch(e){} } renderChat();}catch(e){clearTimeout(timeout); renderChat();}}
  async function sendChatMessage(){if(chatLock)return; const inp=document.getElementById('chatInput'); const text=inp.value.trim(); if(!text)return; chatLock=true; addMsg(text,'user'); inp.value=''; const t=document.createElement('div'); t.className='msg typing'; t.id='typing'; t.textContent='NexusAI yozmoqda...'; document.getElementById('chatMessages').appendChild(t); let reply='Aloqa xatosi. Xabarni qayta yuboring.'; try{const uid=String(tgUserId||'preview'); const firstName=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'User'; const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),30000); const r=await fetch(CONFIG.chatUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,message:text,first_name:firstName,geo:CONFIG.geo,lang:CONFIG.lang,source:'miniapp'}),signal:controller.signal}); clearTimeout(timeout); const raw=await r.text(); let d={}; try{d=raw?JSON.parse(raw):{}}catch(e){d={reply:raw}} if(!r.ok)throw new Error('chat_http_'+r.status); reply=d.reply||d.message||d.text||reply;}catch(e){if(e&&e.name==='AbortError')reply="Javob vaqti tugadi. Qayta urinib ko'ring.";} document.getElementById('typing')?.remove(); addMsg(reply,'bot'); chatLock=false;}
  function mockAttach(){addMsg('Bu yerda rasm yuklash hali ulanmagan. Kirish uchun asosiy bot suhbatidan foydalaning.','bot')}
  document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage();}});
  renderMatches();
  refreshAccessState();
</script>
